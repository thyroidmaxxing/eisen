<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eisen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Eisen</title>
<style>

:root{--bg:#000000;--s1:#101214;--s2:#191C20;--s3:#23272C;--line:#2C3137;--tx:#F4F3F1;--mut:#9AA2AB;--dim:#6B737C;--red:#D6453D;--blue:#3B7BDB;--yel:#F0A91E;--grn:#3FA05E;--dc:#ECEAE4;
--num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,Roboto,sans-serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Segoe UI",sans-serif;--sb:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--sans);padding-bottom:calc(88px + var(--sb));overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
body.timing{padding-bottom:calc(170px + var(--sb))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 16px 8px;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header.top h1{font-size:15px;font-weight:650;color:var(--mut);margin:0}
main{max-width:640px;margin:0 auto;padding:4px 16px 24px}
h2{font-size:24px;font-weight:750;letter-spacing:-.015em;margin:0;line-height:1.15}
h3{font-size:15px;font-weight:650;margin:0}
.sec{margin-top:24px}
.sec>h3,.sec-h h3{color:var(--mut);font-size:14px;margin:0 0 8px 2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.mut{color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:8px 2px 0}
.empty{color:var(--mut);font-size:14.5px;background:var(--s1);border-radius:14px;padding:16px;margin:8px 0 0}
.warn{color:var(--yel);font-weight:650}
.card{background:var(--s1);border-radius:20px;padding:14px}
.card.list{padding:0 12px}
.card.list>:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border:0;border-top:1px solid var(--s2);background:none;text-align:left}
.row b{font-weight:600}
.row small{display:block;color:var(--mut);font-size:13px}
.grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background-image:radial-gradient(circle,rgba(0,0,0,.82) 0 22%,transparent 27%)}
.dot.lg{width:20px;height:20px}
.dotbtn{width:24px;height:24px;border-radius:50%;border:0;flex:none;background-image:radial-gradient(circle,rgba(0,0,0,.82) 0 22%,transparent 27%)}
.ib{flex:none;display:inline-grid;place-items:center;min-width:40px;height:40px;border:0;border-radius:12px;background:var(--s2);font-size:19px;padding:0 8px}
.ib.sm{min-width:34px;height:34px;font-size:15px;color:var(--mut);background:none}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.primary{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--tx);color:var(--bg);font-weight:750;font-size:16.5px}
.primary:active{transform:scale(.99)}
.ghost{display:block;width:100%;margin-top:10px;padding:13px;border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--mut);font-weight:600}
.danger{color:#E8837B!important}
.link{background:none;border:0;color:var(--tx);font-weight:650;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.txt{display:block;width:100%;background:var(--s2);border:0;border-radius:12px;padding:12px;outline:none;-webkit-appearance:none;appearance:none;font-size:16px}
textarea.txt{resize:vertical;min-height:70px}
select.txt{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.num-s{width:84px;text-align:right;font:600 17px var(--num)}
.lbl{display:block;font-size:13px;color:var(--mut)}
.lbl .txt{margin-top:4px;color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld{display:block;background:var(--s1);border-radius:14px;padding:8px 12px 7px;min-width:0}
.fld>span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .in{display:flex;align-items:baseline;gap:4px}
.fld input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;padding:1px 0;font:650 22px/1.2 var(--num);font-variant-numeric:tabular-nums}
.fld i{font-style:normal;font-size:12.5px;color:var(--dim)}
.fld:focus-within{box-shadow:inset 0 0 0 2px var(--line)}
.card .fld{background:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:none;font-size:14.5px;font-weight:550}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.addrow,.addgrid{display:flex;gap:8px;margin-top:10px}
.addgrid .txt,.addrow .txt{flex:1}
.daynav{display:flex;align-items:center;gap:8px;margin-top:4px}
.dn-date{flex:1;text-align:left;background:none;border:0;padding:0 4px}
.dn-date b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.dn-date span{color:var(--mut);font-size:14px}
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:14px;border-radius:16px;overflow:hidden;background:var(--s2)}
.trend>div{background:var(--s1);padding:10px 12px}
.trend small{display:block;font-size:11.5px;color:var(--mut);line-height:1.25}
.trend b{display:block;font:700 20px/1.3 var(--num);font-variant-numeric:tabular-nums}
.trend em{display:block;font-style:normal;font-size:11.5px;color:var(--dim)}
.banner{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:16px;padding:12px 12px 12px 14px;margin:4px 0 10px;box-shadow:inset 4px 0 0 var(--yel)}
.banner div{flex:1}.banner b{display:block;font-size:14.5px}.banner span{font-size:13px;color:var(--mut)}
.banner button{border:0;border-radius:10px;background:var(--tx);color:var(--bg);font-weight:700;padding:9px 12px}
.note-line{display:block;width:100%;text-align:left;background:none;border:0;box-shadow:inset 4px 0 0 var(--blue);padding:6px 12px;margin:0 0 8px;color:var(--tx);font-size:14px}
.livebar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;background:var(--s2);padding:12px 14px;margin:4px 0 10px;box-shadow:inset 4px 0 0 var(--dc)}
.livebar small{display:block;color:var(--mut);font-size:13px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid var(--s2)}
.w-auto{width:auto;min-width:130px}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:26px;text-align:center;font:700 22px var(--num)}
.tog{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:var(--s3)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--mut);transition:transform .15s}
.tog.on{background:var(--grn)}.tog.on::after{transform:translateX(20px);background:#fff}
.cycline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--mut);font-size:14px;font-weight:600;margin-top:4px}
.badge{padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.intro{background:var(--blue);color:#fff}.badge.deload{background:var(--yel);color:var(--bg)}
.hero{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.plate{width:min(66vw,240px);height:auto;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.hero .primary{max-width:320px}
.wo-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 4px;border-bottom:3px solid var(--dc)}
.wo-head p{margin:2px 0 6px;font-size:13.5px}
.elapsed{font:700 17px var(--num);color:var(--mut);padding-bottom:6px}
.modebar{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--s2);font-size:13.5px}
.modebar.deload{box-shadow:inset 4px 0 0 var(--yel)}.modebar.intro{box-shadow:inset 4px 0 0 var(--blue)}.modebar.normal{box-shadow:inset 4px 0 0 var(--line)}
.ex{margin-top:12px;background:var(--s1);border-radius:20px;padding:13px 12px 8px 14px;box-shadow:inset 4px 0 0 var(--dc)}
.ex.complete{opacity:.6}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-h h3{font-size:16.5px}
.ex-h p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.setup{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:6px;background:var(--s3);color:var(--tx);font-weight:650;font-size:12.5px}
.last{margin:8px 0 4px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:50px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.8fr) 46px;gap:6px;align-items:center;padding:4px 0}
.tgt b{display:block;font:650 15px/1.2 var(--num)}
.tgt small{display:block;font-size:11px;color:var(--dim)}
.si{display:flex;flex-direction:column;min-width:0;background:var(--s2);border-radius:11px;padding:4px 8px 3px}
.si input{width:100%;min-width:0;background:none;border:0;outline:none;padding:0;font:650 19px/1.25 var(--num);font-variant-numeric:tabular-nums}
.si small{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si:focus-within{box-shadow:inset 0 0 0 2px var(--line)}
.si.up{box-shadow:inset 0 0 0 2px var(--dc)}.si.up small{color:var(--tx)}
.si.low small{color:var(--yel)}
.chk{height:46px;border-radius:13px;border:2px solid var(--line);background:none;font-size:21px;font-weight:800;color:var(--bg)}
.set.done .chk{background:var(--dc);border-color:var(--dc)}
.set.done .si{background:transparent}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 10px;padding:2px 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;border-radius:999px;background:var(--s1);color:var(--mut);padding:9px 14px;font-weight:650;font-size:14px}
.seg button.on{background:var(--tx);color:var(--bg)}
.seg.sm button{padding:7px 12px;font-size:13px}
.kv{display:flex;gap:18px;margin-bottom:6px;flex-wrap:wrap}
.kv small{display:block;font-size:12px;color:var(--mut)}
.kv b{font:700 19px var(--num);font-variant-numeric:tabular-nums}
.chart{display:block;width:100%;height:auto;margin-top:6px}
.chart .ax{fill:var(--dim);font:10.5px var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.t th{padding:4px 4px 8px;font-size:12px;font-weight:650;color:var(--mut);text-align:right}
.t td{padding:9px 4px;border-top:1px solid var(--s2);text-align:right;vertical-align:top}
.t th:first-child,.t td:first-child{text-align:left}
.t small{display:block;font-size:11px;color:var(--dim)}
.t .hi{color:var(--yel);font-weight:700}
.pday{margin-top:8px;background:var(--s1);border-radius:18px;padding:0 12px}
.pday .pday-h{border-top:0}
.pday-b{padding-bottom:12px}
.pex{display:flex;align-items:center;gap:2px;border-top:1px solid var(--s2)}
.pex-m{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 2px}
.pex-m b{display:block;font-weight:600;font-size:15px}
.pex-m small{display:block;color:var(--mut);font-size:12.5px}
.cyc-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cyc-n{background:none;border:0;text-align:left;padding:0}
.cyc-n small,.cyc-w small{display:block;font-size:13px;color:var(--mut)}
.cyc-n b{font:800 52px/1 var(--num);letter-spacing:-.02em}
.wkc{display:flex;align-items:center;gap:8px}
.wkc b{font:750 28px var(--num);min-width:64px;text-align:center}
.wkc i{font-style:normal;color:var(--dim);font-size:17px}
details.card summary{font-weight:650;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;color:var(--mut);font-size:20px;line-height:1}
details[open].card summary::after{content:"\2212"}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,.55)}
.sheet.hidden{display:none}
.sheet-card{width:100%;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + var(--sb));-webkit-overflow-scrolling:touch}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.menu button{display:block;width:100%;text-align:left;background:var(--s2);border:0;border-radius:12px;padding:14px;margin-top:8px;font-weight:600}
.edset,.hset{display:grid;grid-template-columns:22px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px}
.hset{grid-template-columns:22px 1fr 1fr 1fr}
.edset>span,.hset>span{color:var(--dim);font:600 14px var(--num)}
.hex{margin-top:14px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sb));z-index:8;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--s3);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.timer.hidden{display:none}
.timer.end{background:var(--grn)}
.tt{flex:1;text-align:center}
#tleft{font:750 28px/1.1 var(--num);font-variant-numeric:tabular-nums}
.tbar{height:4px;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden;margin-top:5px}
.tbar i{display:block;height:100%;width:100%;background:var(--tx);transition:width .25s linear}
.timer button{border:0;border-radius:12px;background:rgba(0,0,0,.22);padding:11px 12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%);z-index:30;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--s2);padding:6px 4px calc(6px + var(--sb))}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--dim);font-size:11px;font-weight:650;padding:4px 0}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.live::after{content:"";position:absolute;top:3px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--red)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.streak[hidden]{display:none}
:root{--acc:#FF5A1F}
nav.tabs button.on{color:var(--acc)}
.seg button.on{background:var(--acc);color:#fff}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wkd.next{box-shadow:inset 0 0 0 2px var(--acc);color:var(--tx)}
.tog.on{background:var(--acc)}
.si.hit{box-shadow:inset 0 0 0 2px var(--acc)}.si.hit small{color:var(--acc)}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.timer.end{background:var(--acc)}
.cal{display:flex;gap:4px;margin-top:2px}
.cald{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
 padding:9px 2px 7px;border:0;border-radius:13px;background:none;color:var(--dim);font:650 11px var(--sans)}
.cald b{display:block;font:700 16px var(--num);color:var(--mut)}
.cald.today{background:var(--s1)}
.cald.today b{color:var(--tx)}
.cald u{display:flex;gap:3px;height:6px;text-decoration:none}
.cald u i{width:6px;height:6px;border-radius:50%;display:block}
.spark{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.spcard{background:var(--s1);border-radius:18px;padding:12px 12px 6px;min-width:0}
.spcard small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spcard b{display:block;font:700 23px/1.2 var(--num);font-variant-numeric:tabular-nums;margin-top:2px}
.spcard em{font-style:normal;font-size:12px;color:var(--dim)}
.spcard svg{display:block;width:100%;height:46px;margin-top:6px;overflow:visible}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
 background:var(--s1);font:650 13px var(--sans);color:var(--tx)}
.streak i{font-style:normal;color:var(--acc)}

.banner{padding:10px 12px}
.banner b{font-size:14px;line-height:1.25}
.banner span{font-size:12.5px;line-height:1.3;display:block}
.banner button{padding:8px 11px;font-size:13px;white-space:nowrap}

.wkrow{display:flex;gap:6px}
.wkd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 3px;
 border:0;border-radius:13px;background:var(--s2);font:650 11.5px var(--sans);color:var(--dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkd i{width:10px;height:10px;border-radius:50%;display:block;opacity:.3}
.wkd.done{color:var(--tx)}.wkd.done i{opacity:1}
.wkd.next{box-shadow:inset 0 0 0 2px var(--tx);color:var(--tx)}
.wkmeta{display:flex;justify-content:space-between;gap:10px;margin-top:11px;font-size:12.5px;
 color:var(--mut);font-variant-numeric:tabular-nums}
.wkmeta b{display:block;color:var(--tx);font:700 17px var(--num)}
.vbar{height:7px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:5px}
.vbar i{display:block;height:100%;background:var(--chalk)}
.vbar i.lo{background:var(--yel)}.vbar i.hi{background:var(--blue)}

.si.hit{box-shadow:inset 0 0 0 2px var(--grn)}.si.hit small{color:var(--grn)}
.si.miss{box-shadow:inset 0 0 0 2px var(--red)}.si.miss small{color:var(--red)}
.si.over small{color:var(--yel)}
.fixline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 7px;padding:8px 10px;border-radius:11px;
 background:var(--s2);box-shadow:inset 4px 0 0 var(--red);font-size:12.5px;color:var(--mut)}
.fixline span{flex:1;min-width:120px}
.fixline button{border:0;border-radius:9px;background:var(--tx);color:var(--bg);font-weight:700;padding:8px 11px;font-size:12.5px}
.hitline{margin:5px 0 0;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hitline b{color:var(--tx)}
.hitline.bad{color:var(--yel)}

.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.phc{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s2);border:0;padding:0}
.phc img{width:100%;height:100%;object-fit:cover;display:block}
.phc span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.78));
 color:#fff;font:600 11px/1.3 var(--num);font-variant-numeric:tabular-nums;text-align:left}
.phc.a{box-shadow:inset 0 0 0 3px var(--blue)}
.phc.b{box-shadow:inset 0 0 0 3px var(--grn)}
.phc i{position:absolute;top:5px;left:5px;font-style:normal;font:700 10px var(--num);padding:2px 6px;border-radius:999px;background:var(--blue);color:#fff}
.phc.b i{background:var(--grn)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp figure{margin:0;min-width:0}
.cmp .fr{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s2)}
.cmp .fr img{width:100%;height:100%;object-fit:contain}
.cmp figcaption{margin-top:6px;font:600 12.5px/1.35 var(--num);font-variant-numeric:tabular-nums;color:var(--mut)}
.cmp figcaption em{font-style:normal;color:var(--tx);display:block}
.wipe{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s2);margin-top:10px}
.wipe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.wipe .hl{position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);left:50%;pointer-events:none}
.wiperange{width:100%;margin-top:8px;accent-color:var(--chalk)}
.phdrop{display:block;width:100%;margin-top:10px;padding:16px;border:1.5px dashed var(--line);border-radius:14px;
 background:none;color:var(--mut);font-weight:600;text-align:center}
.synced{font-size:12.5px;color:var(--dim);margin:8px 2px 0}

.stgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 3px 7px;border:0;
 border-radius:14px;background:var(--s1);color:var(--dim);font:600 10.5px/1.25 var(--sans);text-align:center}
.stb svg{width:100%;height:24px;display:block}
.stsvg{fill:#9C7A5C}
.stsvg .stline{stroke:#9C7A5C}
.stb b{font:700 13px var(--num);color:var(--mut);margin-top:2px}
.stb span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stb .dash{font:700 20px/24px var(--num);color:var(--dim)}
.stb.on{background:var(--s3);color:var(--tx)}
.stb.on b{color:var(--tx)}
.stb.on.ok{box-shadow:inset 0 0 0 2px var(--grn)}
.stb.on.warn{box-shadow:inset 0 0 0 2px var(--yel)}
.stb.on.bad{box-shadow:inset 0 0 0 2px var(--red)}
.stb.none.on{box-shadow:inset 0 0 0 2px var(--line)}
.stdesc{margin:9px 2px 0;font-size:13px;color:var(--mut);padding-left:10px;
 border-left:3px solid var(--line);line-height:1.4}
.stdesc.ok{border-color:var(--grn)}.stdesc.warn{border-color:var(--yel)}.stdesc.bad{border-color:var(--red)}
.stbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:var(--s2)}
.stbar i{display:block;height:100%}
.stbar i.ok{background:var(--grn)}.stbar i.warn{background:var(--yel)}.stbar i.bad{background:var(--red)}

.ready{background:var(--s1);border-radius:16px;padding:11px 12px;margin:4px 0 10px}
.ready.gut{box-shadow:inset 4px 0 0 var(--grn)}
.ready.achtung{box-shadow:inset 4px 0 0 var(--yel)}
.ready.stop{box-shadow:inset 4px 0 0 var(--red)}
.rh{display:flex;align-items:center;gap:9px}
.rh b{flex:1;font-size:15px}
.rsum{margin:4px 0 0 21px;font-size:12.5px;color:var(--mut)}
.rlist{margin-top:9px;border-top:1px solid var(--s2)}
.ri{display:flex;align-items:flex-start;gap:9px;padding:9px 0 8px;border-top:1px solid var(--s2)}
.ri:first-child{border-top:0}
.ri .dot{margin-top:4px}
.ri b{display:block;font-size:13.5px;font-weight:650}
.ri small{display:block;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ri em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.ri.achtung em{color:var(--mut)}.ri.stop em{color:var(--mut)}
.setup.gear{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut)}
.t td.ref-ziel-hi{color:var(--yel)}
.t td.ref-ziel-lo{color:var(--blue)}
.t td.ref-hart-hi,.t td.ref-hart-lo{color:var(--red);font-weight:700}

</style>
</head>
<body>
<header class="top"><h1 id="title">Tageslog</h1><span class="streak" id="streak" hidden></span><button class="ib" data-a="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></header>
<main id="main"></main>
<div id="timer" class="timer hidden" role="timer"><button data-a="tminus" aria-label="15 Sekunden weniger">&minus;15</button><div class="tt"><div id="tleft">0:00</div><div class="tbar"><i id="tfill"></i></div></div><button data-a="tplus" aria-label="15 Sekunden mehr">+15</button><button data-a="tskip">Weiter</button></div>
<nav class="tabs" id="tabs">
<button data-a="tab" data-t="heute"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Heute</button>
<button data-a="tab" data-t="training"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Training</button>
<button data-a="tab" data-t="progress"><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 3 7-8"/><path d="M4 20h16"/></svg>Progress</button>
<button data-a="tab" data-t="health"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Health</button>
<button data-a="tab" data-t="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg>Plan</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetc"></div></div>
<div id="toast" class="toast" role="status"></div>

<script>

'use strict';
const C={red:'#D6453D',blue:'#3B7BDB',yel:'#E7B431',grn:'#3FA05E',chalk:'#ECEAE4',mut:'#98A2AC',bg:'#1B1F23'};
const PLATE=[C.red,C.blue,C.yel,C.grn,C.chalk];
const PHC={'Diät':C.blue,'Reverse':C.yel,'Aufbau':C.grn,'Erhaltung':C.mut};
const RATE={gut:C.grn,mittel:C.yel,schlecht:C.red},RORD=['gut','mittel','schlecht'];
const NUMF='ui-rounded,-apple-system,system-ui,Roboto,sans-serif',SANSF='-apple-system,system-ui,Roboto,sans-serif';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const todayStr=()=>iso(new Date());
const pd=s=>new Date(s+'T12:00:00');
const tms=s=>pd(s).getTime();
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((tms(b)-tms(a))/864e5);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const dv=v=>v==null||v===''?'':String(v).replace('.',',');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const last=a=>a&&a.length?a[a.length-1]:null;
const rnd=x=>Math.round(x*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=(n,d=1)=>n==null||!isFinite(n)?'–':n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=1)=>n==null||!isFinite(n)?'–':(n>0?'+':n<0?'−':'±')+fmt(Math.abs(n),d);
const p2=n=>String(n).padStart(2,'0');
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fD=s=>{const d=pd(s);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`};
const fDs=s=>{const d=pd(s);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.`};
const e1rm=(w,r)=>{w=num(w);r=num(r);return w&&r?w*(1+r/30):null};
const dot=(c,cls='')=>`<i class="dot ${cls}" style="background-color:${c}"></i>`;
const chip=(v,on,a)=>`<button class="chip ${on?'on':''}" data-a="${a}" data-v="${esc(v)}">${esc(v)}</button>`;
const agoTxt=d=>{const n=daysBetween(d,todayStr());return n<=0?'heute':n===1?'gestern':`vor ${n} Tagen`};

/* Speicher: IndexedDB, Fallback im Arbeitsspeicher */
const DB={db:null,mem:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('eisen',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(k){return new Promise(res=>{if(!DB.db)return res(DB.mem);try{const q=DB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!DB.db){DB.mem=v;return res()}try{const tx=DB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}};
let saveT=null;
function save(){S._ts=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',S),300);if(typeof cloudSave==='function')cloudSave()}

/* Standardplan: PPLOKUK aus dem Juni-Stand */
function X(name,muscle,spec,rest=90){const [g,rir]=spec.split('@');const sets=[];g.split(',').forEach(p=>{const m=p.trim().match(/(\d+)x(\d+)-(\d+)/);for(let i=0;i<+m[1];i++)sets.push({min:+m[2],max:+m[3],rir})});return {id:uid(),name,muscle,setup:'',rest,inc:null,sets}}
const ABS=()=>[X('Cable Crunches kniend','Bauch','3x8-12@0-1'),X('Cable Crunches stehend','Bauch','3x12-15@0-1')];
function defaultPlan(){return {rotation:['Push','Pull','Legs','Off','OK','Legs 2','Off'],days:[
 {name:'Push',ex:[X('Multipresse Incline Press','obere Brust','1x4-7,1x7-10@0-1'),X('Flachbankdrücken KH/LH','mittlere Brust','1x5-8,1x8-11@0-1'),X('KH Schulterdrücken','vordere Schulter','1x7-10,1x10-13@0-1'),X('Negative Butterfly','Brust Iso','1x10-13,1x13-16@0-1'),X('Machine Side Raises','seitliche Schulter','1x8-11,2x11-14@0'),X('Cross Body Triceps Extension','Trizeps allgemein','1x7-10,1x10-13@0'),X('Katana Triceps Extension','Trizeps langer Kopf','1x10-13,2x13-16@0'),...ABS()]},
 {name:'Pull',ex:[X('Neutral Grip Pull Down','Lat vertikal','1x6-9,1x9-12@0-1'),X('Neutral Grip Machine Row','Lat horizontal','1x7-10,1x10-13@0-1'),X('Chest Supported T-Bar Row','Trapez','1x5-8,2x8-11@0-1'),X('Wide Grip Pull Down','Lat allgemein','1x8-11,1x11-14@0-1'),X('Rev. Pec Deck','hintere Schulter','1x10-13,2x13-16@0'),X('Machine Preacher Curl','Bizeps','1x7-10,1x10-13@0'),X('KH Hammer Curl','Brachialis','1x9-12,2x12-15@0'),...ABS()]},
 {name:'Legs',ex:[X('Leg Extension','Quad Iso','1x7-10,1x10-13@0-1'),X('Hack Squat / Pendulum','Quad','1x4-7,1x7-10@1-2',180),X('Seated Ham Curl','Hamstring Iso','1x8-11,2x11-14@0-1'),X('Leg Press','Quad','1x8-11,1x11-14@1'),X('RDL','Hamstring Hinge','1x5-8,1x8-11@1-2'),X('Wadenheben stehend, Innenrotation','Wade','1x7-10,2x10-13@0'),...ABS()]},
 {name:'OK',ex:[X('KH Seitheben','seitliche Schulter','1x10-13,2x13-16@0'),X('Machine Flat Press','mittlere Brust','1x5-8,2x8-11@0-1'),X('Langhantelrudern schwer','Trapez','1x5-8,2x8-11@0-1'),X('Incline Cable Press','obere Brust','1x7-10,2x10-13@0-1'),X('Lat Pull Down einarmig','Lat vertikal','1x8-11,2x11-14@0-1'),X('SZ Cable Curl','Bizeps','1x8-11,2x11-14@0'),X('Overhead Triceps Ext. mit Bank','Trizeps langer Kopf','1x9-12,2x12-15@0'),...ABS()]},
 {name:'Legs 2',ex:[X('Lying Ham Curl','Hamstring Iso','1x7-10,2x10-13@0-1'),X('RDL','Hamstring Hinge','1x4-7,1x7-10@1-2'),X('Hackenschmidt','Quad','1x7-10,1x10-13@1'),X('Single Leg Leg Extension','Quad Iso','1x9-12,2x12-15@0'),X('Seated Adduction','Adduktoren','1x9-12,1x12-15@0'),X('Seated Abduction','Abduktoren','2x12-15@0'),X('Wadenheben sitzend, Außenrotation','Wade','1x10-13,2x13-16@0'),...ABS()]}]}}
const MK=[['TSH','mU/l'],['fT3','pg/ml'],['fT4','ng/dl'],['TPO-AK','IU/ml'],['Tg-AK','IU/ml'],['Testosteron gesamt','ng/dl'],['Testosteron frei','pg/ml'],['Estradiol','pg/ml'],['SHBG','nmol/l'],['LH','U/l'],['FSH','U/l'],['Prolaktin','ng/ml'],['DHEA-S','µg/dl'],['Cortisol morgens','µg/dl'],['Hämatokrit','%'],['Hämoglobin','g/dl'],['Ferritin','ng/ml'],['Vitamin D (25-OH)','ng/ml'],['HbA1c','%'],['Glukose nüchtern','mg/dl'],['LDL','mg/dl'],['HDL','mg/dl'],['Triglyceride','mg/dl'],['GOT (AST)','U/l'],['GPT (ALT)','U/l'],['GGT','U/l'],['Kreatinin','mg/dl'],['CK','U/l'],['Vitamin A (Retinol)','µg/l'],['Kupfer','µg/dl']];
function fresh(){return {v:1,days:{},photos:[],sessions:[],measures:[],blood:[],tolerance:[],phases:[],active:null,plan:defaultPlan(),
 cycle:{n:18,week:1,len:6,intro:true,deload:true,start:todayStr(),hist:[]},
 settings:{inc:2.5,backupDays:7,lastBackup:null,measureEvery:14,bloodEvery:90,
  labels:['Temp morgens','Temp nachmittags','Puls morgens','Puls nachmittags'],
  supps:['Kreatin','Vitamin D3','Magnesium','Omega-3','Elektrolyte','EAA'],
  tags:['Migräne','Kopfschmerzen','Schlecht geschlafen','Stress','Refeed','Energie hoch','Energie tief','Völlegefühl'],
  pre:['Nüchtern','Koffein','Pre-Stack','Nach Mahlzeit'],
  mfields:['Taille (Nabel)','Hüfte','Brust','Arm rechts','Oberschenkel rechts','Wade rechts','KFA %'],
  markers:MK.map(([n,u])=>({n,u}))}}}
function migrate(st){const f=fresh();for(const k in f)if(st[k]==null)st[k]=f[k];for(const k in f.settings)if(st.settings[k]==null)st.settings[k]=f.settings[k];for(const k in f.cycle)if(st.cycle[k]==null)st.cycle[k]=f.cycle[k];return st}

let S=null;
const ui={tab:'heute',date:todayStr(),prog:'gewicht',health:'koerper',range:'3M',ex:null,metric:'t1',tag:null,mf:null,bm:null,openDay:null,edit:null,
 mform:{date:todayStr(),vals:{}},bform:{date:todayStr(),vals:{}},tform:{name:'',rate:'gut',note:''},phform:{type:'Diät',date:todayStr()},pendingImport:null};
const dayRec=d=>S.days[d]||(S.days[d]={});

/* Tageswerte */
function rng(d,from,to,f){const a=[];for(let i=from;i<=to;i++){const r=S.days[addDays(d,-i)];const v=r?num(r[f]):null;if(v!=null)a.push(v)}return a}
function series(f){const m=new Map();
 if(HIST&&HIST[f])for(const r of HIST[f])m.set(r[0],r[1]);
 Object.keys(S.days).forEach(d=>{const v=num(S.days[d][f]);if(v!=null)m.set(d,v)});
 return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1)}
function rolling(pts,win=7){const out=[];let j=0;for(let i=0;i<pts.length;i++){while(daysBetween(pts[j][0],pts[i][0])>=win)j++;out.push([pts[i][0],avg(pts.slice(j,i+1).map(x=>x[1]))])}return out}

/* Zyklus und Progression */
function weekMode(c){if(c.deload&&c.week>=c.len)return 'deload';if(c.intro&&c.week===1)return 'intro';return 'normal'}
const MODE={normal:'Normal',intro:'Intro-Woche',deload:'Deload'};
const MODETXT={normal:'Normale Woche. RIR-Ziele wie im Plan.',intro:'Intro-Woche. Alle RIR-Ziele +1, damit du reinkommst.',deload:'Deload. Halbe Sätze, RIR 3-4, Gewicht halten.'};
function rirShow(r,mode){if(mode==='deload')return '3-4';if(mode==='intro')return String(r).split('-').map(x=>(parseFloat(x)||0)+1).join('-');return String(r)}
function setsFor(e,mode){return mode==='deload'?e.sets.slice(0,Math.max(1,Math.ceil(e.sets.length/2))):e.sets}
function dayColor(n){const i=S.plan.days.findIndex(d=>d.name===n);return i<0?C.mut:PLATE[i%PLATE.length]}
const inkOn=c=>(c===C.yel||c===C.chalk)?C.bg:C.chalk;
function planEx(name){for(const d of S.plan.days)for(const e of d.ex)if(e.name===name)return e;return null}
function lastPerf(name,day,gear){const g=gear||'';let any=null;for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];if(s.mode==='deload')continue;const e=s.ex.find(x=>x.name===name&&x.sets.length&&(x.gear||'')===g);if(!e)continue;if(s.day===day)return {s,e};if(!any)any={s,e}}return any}
function suggest(spec,ps,inc,prog){if(!ps||num(ps.w)==null)return null;const w=num(ps.w),r=num(ps.r),rir=num(ps.rir),rmin=parseFloat(spec.rir)||0;if(r!=null&&r>=spec.max&&(rir==null||rir>=rmin))return {w:rnd(w+inc),up:true};if(prog!=='reps'&&r!=null&&r<spec.min){const t=corrLoad(w,r,spec,inc);if(t&&t<w)return {w:t,low:true}}return {w,up:false,low:r!=null&&r<spec.min}}
function sugFor(mode,spec,ps,inc,prog){return mode==='deload'?(ps&&num(ps.w)!=null?{w:num(ps.w)}:null):suggest(spec,ps,inc,prog)}
function mkEx(e,day,mode){const specs=setsFor(e,mode),lp=lastPerf(e.name,day,e.gear),inc=num(e.inc)??num(S.settings.inc)??2.5;
 return {name:e.name,muscle:e.muscle||'',setup:e.setup||'',rest:e.rest||90,inc,prog:e.prog||'',gear:e.gear||'',specs:specs.map(s=>({min:s.min,max:s.max,rir:rirShow(s.rir,mode),base:s.rir})),last:lp?{date:lp.s.date,sets:lp.e.sets}:null,
  sets:specs.map((s,i)=>{const ps=lp?(lp.e.sets[i]||last(lp.e.sets)):null;const g=sugFor(mode,s,ps,inc,e.prog);return {w:g?dv(g.w):'',r:'',rir:'',done:false,up:!!(g&&g.up),low:!!(g&&g.low)}})}}
function swapEx(ei,name){const a=S.active,e=a.ex[ei],pe=planEx(name);e.name=name;e.setup=pe?pe.setup||'':'';e.prog=pe?pe.prog||'':'';e.gear=pe?pe.gear||'':'';e.inc=pe&&num(pe.inc)!=null?num(pe.inc):e.inc;if(pe&&pe.muscle)e.muscle=pe.muscle;const lp=lastPerf(name,a.day,pe&&pe.gear);e.last=lp?{date:lp.s.date,sets:lp.e.sets}:null;
 e.sets.forEach((s,i)=>{if(s.done)return;const sp=e.specs[i]||last(e.specs);const ps=lp?(lp.e.sets[i]||last(lp.e.sets)):null;const g=sugFor(a.mode,{min:sp.min,max:sp.max,rir:sp.base??sp.rir},ps,e.inc,e.prog);s.w=g?dv(g.w):'';s.up=!!(g&&g.up);s.low=!!(g&&g.low)})}
function nextDay(){const rot=S.plan.rotation.filter(x=>x!=='Off'&&S.plan.days.some(d=>d.name===x));if(!rot.length)return S.plan.days[0]?S.plan.days[0].name:null;let ls=null;for(let i=S.sessions.length-1;i>=0;i--)if(rot.includes(S.sessions[i].day)){ls=S.sessions[i];break}if(!ls)return rot[0];return rot[(rot.indexOf(ls.day)+1)%rot.length]}
function lastSessOf(n){for(let i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].day===n)return S.sessions[i];return null}
function newCycle(){const c=S.cycle;c.hist.push({n:c.n,start:c.start,end:todayStr()});c.n++;c.week=1;c.start=todayStr();save()}
function weekCheck(){/* ersetzt durch das Band in vTraining */}

/* Checks im Tageslog */
function macroMsg(r){const k=num(r.kcal),p=num(r.p),c=num(r.c),f=num(r.f);if(p==null||c==null||f==null)return '';const calc=Math.round(4*p+4*c+9*f);if(k==null)return `Makros ergeben ${calc} kcal.`;if(Math.abs(calc-k)/k>.12)return `<span class="warn">Makros ergeben ${calc} kcal, eingetragen sind ${k}.</span> Tippfehler oder Fett und Carbs vertauscht?`;return ''}
function wMsg(d,r){const w=num(r.w);if(w==null)return '';const prev=rng(d,1,7,'w');if(prev.length<3)return '';const a=avg(prev);if(Math.abs(w-a)>2.5)return `<span class="warn">${sg(w-a,1)} kg zum Schnitt der letzten 7 Tage.</span> Tippfehler?`;return ''}
function checks(d,r){return [macroMsg(r),wMsg(d,r)].filter(Boolean).join('<br>')}
function trendHtml(d){const wk=avg(rng(d,0,6,'w')),pw=avg(rng(d,7,13,'w')),kc=avg(rng(d,0,6,'kcal'));const rate=wk!=null&&pw!=null?wk-pw:null;
 return `<div><small>Ø Gewicht 7 Tage</small><b>${fmt(wk,1)}</b><em>kg</em></div><div><small>Trend</small><b>${sg(rate,2)}</b><em>${rate!=null?`kg pro Woche, ${sg(rate/pw*100,1)} %`:'kg pro Woche'}</em></div><div><small>Ø Kalorien 7 Tage</small><b>${kc!=null?Math.round(kc).toLocaleString('de-DE'):'–'}</b><em>kcal</em></div>`}
function dueText(d,every){const left=every-daysBetween(d,todayStr());return left>0?`Nächste in ${left} ${left===1?'Tag':'Tagen'}.`:left===0?'Heute fällig.':`Fällig seit ${-left} ${left===-1?'Tag':'Tagen'}.`}

/* ---------- Heute ---------- */
function backupBanner(){const lb=S.settings.lastBackup,n=S.settings.backupDays||7;if(!Object.keys(S.days).length&&!S.sessions.length)return '';const age=lb?daysBetween(lb,todayStr()):null;if(age!=null&&age<n)return '';
 return `<div class="banner"><div><b>${lb?`Letztes Backup vor ${age} Tagen`:'Noch kein Backup'}</b><span>${CLOUD==='an'?'Synchronisiert, ein Backup schützt zusätzlich vor eigenen Fehlern.':'Deine Daten liegen nur auf diesem Gerät.'}</span></div><button data-a="backup">Sichern</button></div>`}
function dueBanner(){let o='';const m=last(S.measures),b=last(S.blood);
 if(m&&S.settings.measureEvery-daysBetween(m.date,todayStr())<=0)o+=`<button class="note-line" data-a="gohealth" data-v="koerper">Messung: ${dueText(m.date,S.settings.measureEvery)}</button>`;
 if(b&&S.settings.bloodEvery-daysBetween(b.date,todayStr())<=0)o+=`<button class="note-line" data-a="gohealth" data-v="blut">Blutbild: ${dueText(b.date,S.settings.bloodEvery)}</button>`;return o}
const elapsed=()=>`${Math.max(0,Math.floor((Date.now()-S.active.start)/6e4))} min`;
function fld(r,f,label,unit,mode='decimal'){return `<label class="fld"><span>${esc(label)}</span><div class="in"><input data-f="${f}" inputmode="${mode}" autocomplete="off" value="${esc(dv(r[f]))}"><i>${unit}</i></div></label>`}
function vHeute(){const d=ui.date,r=S.days[d]||{},L=S.settings.labels,units=S.plan.days.map(x=>x.name);
 let h='';
 if(S.active)h+=`<button class="livebar" data-a="tab" data-t="training" style="--dc:${dayColor(S.active.day)}">${dot(dayColor(S.active.day))}<span class="grow"><b>${esc(S.active.day)} läuft</b><small>seit ${elapsed()}</small></span><span>Weiter</span></button>`;
 h+=backupBanner()+dueBanner()+readyCard(d);
 h+=calStrip()+weekStrip()+sparkCards();
 h+=`<div class="daynav"><button class="ib" data-a="dprev" aria-label="Vortag">‹</button><button class="dn-date" data-a="dtoday"><b>${d===todayStr()?'Heute':WDL[pd(d).getDay()]}</b><span>${fD(d)}</span></button><button class="ib" data-a="dnext" aria-label="Nächster Tag">›</button></div>`;
 h+=`<div class="trend" id="trend">${trendHtml(d)}</div>`;
 h+=`<section class="sec"><h3>Gewicht und Ernährung</h3><div class="grid2">${fld(r,'w','Gewicht','kg')}${fld(r,'kcal','Kalorien','kcal','numeric')}</div><div class="grid3 mt8">${fld(r,'p','Protein','g','numeric')}${fld(r,'c','Carbs','g','numeric')}${fld(r,'f','Fett','g','numeric')}</div><p class="hint" id="chk">${checks(d,r)}</p></section>`;
 h+=`<section class="sec"><h3>Temperatur und Puls</h3><div class="grid2">${fld(r,'t1',L[0],'°C')}${fld(r,'hr1',L[2],'bpm','numeric')}</div><details class="card mt8"${(r.t2!=null||r.hr2!=null)?' open':''}><summary>Nachmittags</summary><div class="grid2">${fld(r,'t2',L[1],'°C')}${fld(r,'hr2',L[3],'bpm','numeric')}</div></details></section>`;
 h+=`<section class="sec"><h3>Aktivität und Schlaf</h3><div class="grid3">${fld(r,'cardio','Cardio','min','numeric')}${fld(r,'steps','Schritte','','numeric')}${fld(r,'sleep','Schlaf','h')}</div></section>`;
 h+=`<section class="sec"><h3>Training und Verdauung</h3><div class="card list">
  <div class="srow"><span>Einheit</span><select class="txt w-auto" data-f="unit"><option value="">Keine</option>${units.map(u=>`<option ${r.unit===u?'selected':''}>${esc(u)}</option>`).join('')}${r.unit&&!units.includes(r.unit)?`<option selected>${esc(r.unit)}</option>`:''}</select></div>
  <div class="srow"><span>Bauchtraining</span><button class="tog ${r.abs?'on':''}" data-a="abs" aria-label="Bauchtraining"></button></div>
  <div class="srow"><span>Stuhlgang</span><div class="step"><button class="ib" data-a="stool" data-d="-1" aria-label="weniger">−</button><b>${num(r.stool)??0}</b><button class="ib" data-a="stool" data-d="1" aria-label="mehr">+</button></div></div></div><h3 class="mt16">Konsistenz nach Bristol-Skala</h3>${stoolPicker(r)}${stoolHist()}</section>`;
 h+=`<section class="sec"><details class="card"${(r.supps||[]).length?' open':''}><summary>Supplements${(r.supps||[]).length?` · ${(r.supps||[]).length}`:''}</summary><div class="chips mt8">${S.settings.supps.map(s=>chip(s,(r.supps||[]).includes(s),'supp')).join('')}</div><button class="link mt8" data-a="suppall">Alle abhaken</button></details></section>`;
 h+=`<section class="sec"><h3>Tags</h3><div class="chips">${S.settings.tags.map(s=>chip(s,(r.tags||[]).includes(s),'tag')).join('')}</div><div class="addrow"><input class="txt" id="newtag" placeholder="Neuer Tag"><button class="ib" data-a="addtag" aria-label="Tag hinzufügen">+</button></div></section>`;
 h+=`<section class="sec"><h3>Notiz</h3><textarea class="txt" rows="3" data-f="note" placeholder="Wie lief der Tag?">${esc(r.note||'')}</textarea></section>`;
 return h}

/* ---------- Training ---------- */
function plateSVG(name,d){const c=dayColor(name),ink=inkOn(c),sets=d?d.ex.reduce((n,e)=>n+setsFor(e,weekMode(S.cycle)).length,0):0;
 return `<svg class="plate" viewBox="0 0 240 240" role="img" aria-label="Nächste Einheit ${esc(name)}"><circle cx="120" cy="120" r="116" fill="${c}"/><circle cx="120" cy="120" r="101" fill="none" stroke="${ink}" stroke-opacity=".2" stroke-width="2"/><circle cx="120" cy="120" r="33" fill="none" stroke="${ink}" stroke-opacity=".45" stroke-width="4"/><circle cx="120" cy="120" r="27" fill="${C.bg}"/><text x="120" y="80" text-anchor="middle" fill="${ink}" style="font:800 ${name.length>6?26:34}px ${NUMF};letter-spacing:-.5px">${esc(name)}</text><text x="120" y="182" text-anchor="middle" fill="${ink}" fill-opacity=".8" style="font:600 13px ${SANSF}">${d?d.ex.length:0} Übungen, ${sets} Sätze</text></svg>`}
function vTraining(){if(S.active)return vActive();const c=S.cycle,mode=weekMode(c),nd=nextDay(),pdays=S.plan.days;
 let h=`<div class="cycline"><span>Zyklus ${c.n}</span><span>Woche ${c.week} von ${c.len}</span>${mode!=='normal'?`<span class="badge ${mode}">${MODE[mode]}</span>`:''}</div>`;
 h+=weekBanner();
 if(nd){const d=pdays.find(x=>x.name===nd);h+=`<div class="hero">${plateSVG(nd,d)}<button class="primary" data-a="start" data-day="${esc(nd)}">${esc(nd)} starten</button></div>`}
 h+=`<section class="sec"><h3>Andere Einheit</h3><div class="card list">${pdays.filter(d=>d.name!==nd).map(d=>{const ls=lastSessOf(d.name);return `<button class="row" data-a="start" data-day="${esc(d.name)}">${dot(dayColor(d.name),'lg')}<span class="grow"><b>${esc(d.name)}</b><small>${d.ex.length} Übungen${ls?`, zuletzt ${agoTxt(ls.date)}`:''}</small></span><span class="mut">Start</span></button>`}).join('')}</div></section>`;
 h+=`<button class="ghost" data-pa="bfsheet">Einheit nachtragen</button>`;
 const rec=S.sessions.slice(-10).reverse();
 h+=`<section class="sec"><h3>Letzte Einheiten</h3>${rec.length?`<div class="card list">${rec.map(s=>`<button class="row" data-a="sess" data-id="${s.id}">${dot(dayColor(s.day))}<span class="grow"><b>${esc(s.day)}</b><small>${fD(s.date)}${s.cycle!=null?`, Zyklus ${s.cycle}, Woche ${s.week}`:''}${s.dur?`, ${s.dur} min`:''}</small></span><span class="mut">${s.ex.reduce((n,e)=>n+e.sets.length,0)} Sätze</span></button>`).join('')}</div>`:'<p class="empty">Noch keine Einheit gespeichert. Starte oben deine erste.</p>'}</section>`;
 return h}
function lastTxt(e){return e.last?`Zuletzt ${fDs(e.last.date)}: ${e.last.sets.map(s=>`${dv(s.w)||'–'}×${s.r??'?'}${s.rir!=null?` @${s.rir}`:''}`).join(',  ')}`:'Noch kein Eintrag für diese Übung.'}
function setRow(e,ei,s,si){const sp=e.specs[si]||last(e.specs);const lab=s.up?'steigern':s.low?'unter Range':'kg';
 return `<div class="set ${s.done?'done':''}"><span class="tgt"><b>${sp.min}-${sp.max}</b><small>RIR ${esc(sp.rir)}</small></span>
 <label class="si ${s.up?'up':''} ${s.low?'low':''}"><input data-set="${ei},${si},w" inputmode="decimal" autocomplete="off" value="${esc(s.w)}"><small>${lab}</small></label>
 <label class="si"><input data-set="${ei},${si},r" inputmode="numeric" autocomplete="off" value="${esc(s.r)}"><small>Wdh</small></label>
 <label class="si"><input data-set="${ei},${si},rir" inputmode="numeric" autocomplete="off" placeholder="${esc(sp.rir)}" value="${esc(s.rir)}"><small>RIR</small></label>
 <button class="chk" data-a="done" data-ei="${ei}" data-si="${si}" aria-label="Satz ${si+1} abhaken">${s.done?'✓':''}</button></div>`}
function exCard(e,ei){const all=e.sets.length&&e.sets.every(s=>s.done);
 return `<article class="ex ${all?'complete':''}"><div class="ex-h"><div><h3>${esc(e.name)}</h3><p>${esc(e.muscle)}${e.setup?`<span class="setup">${esc(e.setup)}</span>`:''}${e.gear?`<span class="setup gear">${esc(e.gear)}</span>`:''}</p></div><button class="ib sm" data-a="exmenu" data-ei="${ei}" aria-label="Optionen für ${esc(e.name)}">⋯</button></div><p class="last">${lastTxt(e)}</p>${e.sets.map((s,si)=>setRow(e,ei,s,si)).join('')}</article>`}
function vActive(){const a=S.active,c=dayColor(a.day);
 let h=`<div style="--dc:${c}"><div class="wo-head"><div><h2>${esc(a.day)}</h2><p class="mut">Zyklus ${a.cycle}, Woche ${a.week}${a.back?', nachgetragen':''}</p>${hitLine(a)}</div>${a.back?'':`<span class="elapsed" id="elapsed">${elapsed()}</span>`}</div>`;
 if(a.mode!=='normal')h+=`<p class="modebar ${a.mode}">${MODETXT[a.mode]}</p>`;
 if(a.back)h+=`<div class="card"><div class="grid2"><label class="fld"><span>Datum</span><div class="in"><input type="date" data-bf="date" max="${todayStr()}" value="${a.date}"></div></label><label class="fld"><span>Dauer</span><div class="in"><input type="number" inputmode="numeric" data-bf="bdur" value="${esc(a.bdur||'')}"><i>min</i></div></label></div></div>`;
 h+=`<section class="sec"><h3>Pre-Workout</h3><div class="chips">${S.settings.pre.map(p=>chip(p,a.pre.includes(p),'pre')).join('')}</div><input class="txt mt8" data-af="preNote" placeholder="Details, z. B. 200 mg Koffein" value="${esc(a.preNote||'')}"></section>`;
 h+=a.ex.map(exCard).join('');
 h+=`<button class="ghost" data-a="addex">Übung hinzufügen</button><section class="sec"><h3>Notiz zur Einheit</h3><textarea class="txt" rows="2" data-af="note" placeholder="Wie lief es?">${esc(a.note||'')}</textarea></section><button class="primary" data-a="finish">Einheit beenden</button><button class="ghost danger" data-a="discard">Einheit verwerfen</button></div>`;
 return h}
function exMenu(ei){const e=S.active.ex[ei];openSheet(`<div class="sh-h"><h2>${esc(e.name)}</h2><button class="ib" data-a="close" aria-label="Schließen">✕</button></div><div class="menu">
 <button data-a="ex-setup" data-ei="${ei}">Einstellung ${e.setup?'ändern':'eintragen'}</button><button data-a="ex-swap" data-ei="${ei}">Übung tauschen</button><button data-pa="gear" data-v="${ei}">Gerätewechsel eintragen</button><button data-a="ex-addset" data-ei="${ei}">Satz hinzufügen</button><button data-a="ex-delset" data-ei="${ei}">Letzten Satz entfernen</button><button data-a="ex-rest" data-ei="${ei}">Pause ändern, aktuell ${e.rest} s</button><button data-a="ex-up" data-ei="${ei}">Eine Position nach oben</button><button class="danger" data-a="ex-del" data-ei="${ei}">Übung für heute entfernen</button></div>`)}
function sessSheet(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;
 openSheet(`<div style="--dc:${dayColor(s.day)}"><div class="sh-h"><h2>${esc(s.day)}</h2><button class="ib" data-a="close" aria-label="Schließen">✕</button></div><p class="mut">${fD(s.date)}${s.cycle!=null?`, Zyklus ${s.cycle}, Woche ${s.week}`:''}${s.dur?`, ${s.dur} min`:''}${s.mode==='deload'?', Deload':''}${s.pre&&s.pre.length?`<br>Pre-Workout: ${esc(s.pre.join(', '))}`:''}${s.preNote?`, ${esc(s.preNote)}`:''}</p>
 ${s.ex.map((e,ei)=>`<div class="hex"><h3>${esc(e.name)}</h3>${e.sets.map((t,si)=>`<div class="hset"><span>${si+1}</span><label class="si"><input data-hs="${s.id},${ei},${si},w" inputmode="decimal" value="${dv(t.w)}"><small>kg</small></label><label class="si"><input data-hs="${s.id},${ei},${si},r" inputmode="numeric" value="${dv(t.r)}"><small>Wdh</small></label><label class="si"><input data-hs="${s.id},${ei},${si},rir" inputmode="numeric" value="${dv(t.rir)}"><small>RIR</small></label></div>`).join('')}</div>`).join('')}
 ${s.note?`<p>${esc(s.note)}</p>`:''}<p class="hint">Änderungen werden sofort gespeichert.</p><button class="ghost danger" data-a="sessdel" data-id="${s.id}">Einheit löschen</button></div>`)}

/* ---------- Plan ---------- */
function setSum(e){const g=[];e.sets.forEach(s=>{const k=`${s.min}-${s.max}`,l=last(g);if(l&&l.k===k&&l.rir===s.rir)l.n++;else g.push({k,rir:s.rir,n:1})});return g.map(x=>`${x.n}×${x.k}`).join(', ')+`, RIR ${[...new Set(g.map(x=>x.rir))].join(' / ')}, ${e.rest||90} s Pause`}
function vPlan(){const c=S.cycle,mode=weekMode(c);
 let h=puBanner()+`<div class="card"><div class="cyc-top"><button class="cyc-n" data-a="cycnum" aria-label="Zyklusnummer ändern"><small>Zyklus</small><b>${c.n}</b></button><div class="cyc-w"><small>Woche</small><div class="wkc"><button class="ib" data-a="wk" data-d="-1" aria-label="Woche zurück">‹</button><b>${c.week}<i> / ${c.len}</i></b><button class="ib" data-a="wk" data-d="1" aria-label="Woche vor">›</button></div></div></div><p class="modebar ${mode}">${MODETXT[mode]}</p>
 <div class="srow mt8"><span>Wochen pro Zyklus</span><input class="txt num-s" data-c="len" inputmode="numeric" value="${c.len}"></div>
 <div class="srow"><span>Woche 1 als Intro, RIR +1</span><button class="tog ${c.intro?'on':''}" data-a="ctog" data-k="intro" aria-label="Intro-Woche"></button></div>
 <div class="srow"><span>Letzte Woche ist Deload</span><button class="tog ${c.deload?'on':''}" data-a="ctog" data-k="deload" aria-label="Deload"></button></div>
 <button class="primary" data-a="newcyc">Neuen Zyklus starten</button><p class="hint">Gewichte laufen automatisch weiter. Nichts kopieren, nichts umbenennen.</p></div>`;
 if(c.hist.length)h+=`<section class="sec"><h3>Frühere Zyklen</h3><div class="card list">${c.hist.slice().reverse().map(x=>`<div class="row"><span class="grow"><b>Zyklus ${x.n}</b><small>${fD(x.start)} bis ${fD(x.end)}</small></span><span class="mut">${S.sessions.filter(s=>s.cycle===x.n).length} Einheiten</span></div>`).join('')}</div></section>`;
 h+=`<section class="sec"><h3>Reihenfolge</h3><input class="txt" data-rot value="${esc(S.plan.rotation.join(', '))}"><p class="hint">Mit Komma getrennt, Off ist ein Ruhetag. Daraus ergibt sich die nächste Einheit.</p></section>`;
 h+=`<section class="sec"><h3>Trainingstage</h3>${S.plan.days.map((d,di)=>{const o=ui.openDay===di;return `<div class="pday"><button class="row pday-h" data-a="pday" data-di="${di}" aria-expanded="${o}">${dot(dayColor(d.name),'lg')}<span class="grow"><b>${esc(d.name)}</b><small>${d.ex.length} Übungen, ${d.ex.reduce((n,e)=>n+e.sets.length,0)} Sätze</small></span><span class="mut">${o?'Schließen':'Bearbeiten'}</span></button>${o?`<div class="pday-b">${d.ex.map((e,ei)=>`<div class="pex"><button class="pex-m" data-a="editex" data-di="${di}" data-ei="${ei}"><b>${esc(e.name)}</b><small>${setSum(e)}${e.setup?`<br>Einstellung: ${esc(e.setup)}`:''}</small></button><button class="ib sm" data-a="mvex" data-di="${di}" data-ei="${ei}" data-d="-1" aria-label="Nach oben">↑</button><button class="ib sm" data-a="mvex" data-di="${di}" data-ei="${ei}" data-d="1" aria-label="Nach unten">↓</button></div>`).join('')}<button class="ghost" data-a="newex" data-di="${di}">Übung hinzufügen</button><button class="ghost" data-a="renday" data-di="${di}">Tag umbenennen</button><button class="ghost danger" data-a="delday" data-di="${di}">Tag löschen</button></div>`:''}</div>`}).join('')}<button class="ghost" data-a="newday">Trainingstag hinzufügen</button></section>`;
 return h}
function edHtml(){const e=ui.edit.e;return `<div class="sh-h"><h2>${ui.edit.ei==null?'Neue Übung':'Übung bearbeiten'}</h2><button class="ib" data-a="close" aria-label="Schließen">✕</button></div>
 <label class="lbl">Name<input class="txt" data-ed="name" value="${esc(e.name)}"></label>
 <label class="lbl mt8">Zielmuskel<input class="txt" data-ed="muscle" value="${esc(e.muscle||'')}"></label>
 <label class="lbl mt8">Einstellung am Gerät<input class="txt" data-ed="setup" value="${esc(e.setup||'')}" placeholder="z. B. Sitz 4, Füße 5"></label>
 <label class="lbl mt8">Geräteversion<input class="txt" data-ed="gear" value="${esc(e.gear||'')}" placeholder="leer lassen, bis das Gerät wechselt"><small class="hint">Trag hier etwas ein, wenn das Gerät getauscht wurde, z. B. „ab 10/2026“. Vorschläge und Kraftverlauf laufen dann nur noch innerhalb dieser Version.</small></label>
 <div class="grid2 mt8"><label class="lbl">Pause in Sekunden<input class="txt" data-ed="rest" inputmode="numeric" value="${esc(e.rest??90)}"></label><label class="lbl">Steigerung in kg<input class="txt" data-ed="inc" inputmode="decimal" value="${esc(dv(e.inc))}" placeholder="${dv(S.settings.inc)}"></label></div><label class="lbl mt8">Progression<select class="txt" data-ed="prog"><option value=""${e.prog==='reps'?'':' selected'}>Last zuerst (Standard)</option><option value="reps"${e.prog==='reps'?' selected':''}>Wiederholungen zuerst</option></select><small class="hint">Wiederholungen zuerst heißt: die Last bleibt stehen, bis das obere Ende des Bereichs erreicht ist. Für Nacken, Waden und Bauch, wo e1RM nichts aussagt.</small></label>
 <h3 class="mt16">Sätze</h3>${e.sets.map((s,i)=>`<div class="edset"><span>${i+1}</span><label class="si"><input data-eds="${i},min" inputmode="numeric" value="${esc(s.min)}"><small>Wdh min</small></label><label class="si"><input data-eds="${i},max" inputmode="numeric" value="${esc(s.max)}"><small>Wdh max</small></label><label class="si"><input data-eds="${i},rir" value="${esc(s.rir)}"><small>RIR</small></label><button class="ib sm" data-a="eddelset" data-i="${i}" aria-label="Satz entfernen">✕</button></div>`).join('')}
 <button class="ghost" data-a="edaddset">Satz hinzufügen</button><button class="primary" data-a="edsave">Übung speichern</button>${ui.edit.ei!=null?'<button class="ghost danger" data-a="eddel">Übung aus dem Plan löschen</button>':''}`}

/* ---------- Diagramm ---------- */
function chartSVG(sets,opt={}){const all=sets.flatMap(s=>s.pts);if(all.length<2)return `<p class="empty">${opt.empty||'Noch zu wenig Daten für einen Verlauf.'}</p>`;
 const W=360,H=opt.h||200,pl=40,pr=10,pt=10,pb=24;let t0=Infinity,t1=-Infinity,v0=Infinity,v1=-Infinity;
 all.forEach(([d,v])=>{const t=tms(d);if(t<t0)t0=t;if(t>t1)t1=t;if(v<v0)v0=v;if(v>v1)v1=v});
 if(t1===t0)t1=t0+864e5;const pad=(v1-v0)*.08||Math.abs(v1)*.05||1;v0-=pad;v1+=pad;
 const X=t=>+(pl+(t-t0)/(t1-t0)*(W-pl-pr)).toFixed(1),Y=v=>+(pt+(1-(v-v0)/(v1-v0))*(H-pt-pb)).toFixed(1);
 const span=v1-v0,dec=span<3?2:span<30?1:0;let g='';

function strengthSnap(end){const from=addDays(end,-21),m={};S.sessions.forEach(s=>{if(s.date<from||s.date>end)return;s.ex.forEach(e=>e.sets.forEach(t=>{const v=e1rm(t.w,t.r);if(v&&(!m[e.name]||v>m[e.name]))m[e.name]=v}))});return m}

function cutSection(){const ph=[...S.phases].sort((a,b)=>a.start.localeCompare(b.start)),ends=[];ph.forEach((p,i)=>{if(p.type==='Diät'&&ph[i+1])ends.push(addDays(ph[i+1].start,-1))});const wf=S.settings.mfields[0]||'Taille';

 return `<select class="txt" data-sel="ex">${names.map(n=>`<option ${n===ui.ex?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="card mt8"><div class="kv"><div><small>Bestwert, geschätztes 1RM</small><b>${top?fmt(top.v,1)+' kg':'–'}</b></div><div><small>Datum</small><b>${top?fD(top.d):'–'}</b></div></div>${chartSVG(gser.map(x=>({pts:x.pts,color:x.color,dots:true,r:2.6,op:.9,w:2})),{label:'Kraftverlauf'})}${gset.length>1?`<div class="legend">${gser.map(x=>`<span>${dot(x.color)}${esc(x.g||'ohne Version')}</span>`).join('')}</div><p class="hint">Getrennte Linien, weil das Gerät gewechselt hat. Die Lasten sind nicht vergleichbar.</p>`:''}</div>

function perfIndex(){const res={},ss=S.sessions,best=e=>Math.max(0,...e.sets.map(t=>e1rm(t.w,t.r)||0));

function pAnalyse(){const tags=S.settings.tags;if(!tags.includes(ui.tag))ui.tag=tags[0];const ds=Object.keys(S.days).sort(),has=d=>(S.days[d].tags||[]).includes(ui.tag);

 <div class="srow mt8"><span>Erinnerung nach Tagen</span><input class="txt num-s" data-setting="backupDays" inputmode="numeric" value="${st.backupDays}"></div><div class="srow"><span>Dauerhaft gespeichert</span><span id="persist" class="mut">…</span></div></div></section>
 <section class="sec"><h3>Training und Erinnerungen</h3><div class="card list"><div class="srow"><span>Standard-Steigerung in kg</span><input class="txt num-s" data-setting="inc" inputmode="decimal" value="${dv(st.inc)}"></div><div class="srow"><span>Abstand Messungen in Tagen</span><input class="txt num-s" data-setting="measureEvery" inputmode="numeric" value="${st.measureEvery}"></div><div class="srow"><span>Abstand Blutbilder in Tagen</span><input class="txt num-s" data-setting="bloodEvery" inputmode="numeric" value="${st.bloodEvery}"></div></div></section>
 <section class="sec"><h3>Namen der Vitalfelder</h3><div class="grid2">${st.labels.map((l,i)=>`<input class="txt" data-lbl="${i}" value="${esc(l)}">`).join('')}</div></section>
 ${[['supps','Supplements'],['tags','Tags'],['pre','Pre-Workout-Optionen'],['mfields','Messfelder']].map(([k,l])=>`<section class="sec"><h3>${l}</h3><textarea class="txt" rows="4" data-list="${k}">${esc(st[k].join('\n'))}</textarea></section>`).join('')}
 <p class="hint">Eine Zeile pro Eintrag. Gespeichert wird beim Verlassen des Feldes.</p>
 <section class="sec"><h3>Blutmarker</h3><textarea class="txt" rows="8" data-list="markers">${esc(st.markers.map(m=>`${m.n} | ${m.u}${refTxt(m)?' | '+refTxt(m):''}`).join('\n'))}</textarea><p class="hint">Name, Einheit und Referenzbereich, getrennt durch senkrechte Striche. Der Bereich geht als „0,4 bis 4“, „ab 40“ oder „bis 150“. Vorbelegt ist hier dein <b>Zielbereich</b>, nicht der Laborbereich. Die App kennt den Laborbereich zusätzlich: ein Wert außerhalb deines Ziels wird mit einem Dreieck markiert, außerhalb des Laborbereichs mit zwei und in Rot. Zielbereiche sind deutlich schlechter belegt als Laborbereiche, nimm sie als Richtung, nicht als Befund.</p></section>

function persistStatus(){const el=$('#persist');if(!el)return;if(!navigator.storage||!navigator.storage.persisted){el.textContent='nicht verfügbar';return}navigator.storage.persisted().then(p=>{el.innerHTML=p?'Ja':'<button class="link" data-a="persist">Anfragen</button>'})}

/* ---------- Rendern ---------- */
const TITLES={heute:'Tageslog',training:'Training',progress:'Progress',health:'Health',plan:'Plan und Zyklus',mehr:'Einstellungen'};
function render(){const y=scrollY;$('#main').innerHTML=({heute:vHeute,training:vTraining,progress:vProgress,health:vHealth,plan:vPlan,mehr:vMehr})[ui.tab]();$('#title').textContent=TITLES[ui.tab];
 document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===ui.tab);if(b.dataset.t==='training')b.classList.toggle('live',!!S.active)});scrollTo(0,y);if(ui.tab==='mehr')persistStatus()}
function go(t){ui.tab=t;render();scrollTo(0,0)}
function openSheet(h){$('#sheetc').innerHTML=h;$('#sheet').classList.remove('hidden');$('#sheetc').scrollTop=0;document.body.classList.add('noscroll')}
function closeSheet(){$('#sheet').classList.add('hidden');document.body.classList.remove('noscroll');ui.edit=null;render()}
let toT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------- Timer, Ton, Display an ---------- */
const T={end:0,dur:0,iv:null,done:false};
let actx=null,wl=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{unlockAudio();[0,.35].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);const t=actx.currentTime+o;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.28);os.start(t);os.stop(t+.3)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
function startRest(sec){T.dur=sec;T.end=Date.now()+sec*1000;T.done=false;$('#timer').classList.remove('hidden','end');document.body.classList.add('timing');clearInterval(T.iv);T.iv=setInterval(tick,250);tick()}
function tick(){const left=Math.max(0,(T.end-Date.now())/1000),s=Math.ceil(left);$('#tleft').textContent=`${Math.floor(s/60)}:${p2(s%60)}`;$('#tfill').style.width=`${T.dur?Math.min(100,left/T.dur*100):0}%`;
 if(left<=0&&!T.done){T.done=true;$('#timer').classList.add('end');beep();setTimeout(()=>{if(T.done)stopTimer()},5000)}}
function stopTimer(){clearInterval(T.iv);T.done=false;$('#timer').classList.add('hidden');document.body.classList.remove('timing')}
async function wake(){try{if('wakeLock' in navigator&&S.active&&!document.hidden)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){try{wl&&wl.release()}catch(e){}wl=null}

/* ---------- Workout ---------- */
function startWorkout(day,bfdate){const d=S.plan.days.find(x=>x.name===day);if(!d)return;if(!d.ex.length)return toast('Dieser Tag hat noch keine Übungen');const c=S.cycle,mode=weekMode(c);
 S.active={id:uid(),date:(bfdate||todayStr()),back:!!(bfdate&&bfdate!==todayStr()),bdur:'',day,cycle:c.n,week:c.week,mode,start:Date.now(),pre:[],preNote:'',note:'',ex:d.ex.map(e=>mkEx(e,day,mode))};save();wake();render();scrollTo(0,0)}
function doneSet(ei,si){const e=S.active.ex[ei],s=e.sets[si];unlockAudio();
 if(!s.done){if(num(s.r)==null){toast('Erst die Wiederholungen eintragen');const el=document.querySelector(`[data-set="${ei},${si},r"]`);if(el)el.focus();return}s.done=true;startRest(e.rest)}else s.done=false;save();render()}
async function finish(){const a=S.active;
 const sess={id:a.id,date:a.date,day:a.day,cycle:a.cycle,week:a.week,mode:a.mode,pre:a.pre,preNote:a.preNote||'',note:a.note||'',dur:a.back?(num(a.bdur)||0):Math.round((Date.now()-a.start)/6e4),
  ex:a.ex.map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r),rir:num(s.rir)}))})).filter(e=>e.sets.length)};
 if(!sess.ex.length){if(await askC('Kein Satz abgehakt. Einheit verwerfen?')){S.active=null;relWake();stopTimer();save();render()}return}
 const open=a.ex.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);if(open&&!await askC(`${open} Sätze sind noch offen. Trotzdem beenden?`))return;
 const ups=[];if(a.mode!=='deload')a.ex.forEach(e=>e.sets.forEach((s,i)=>{const sp=e.specs[i]||last(e.specs);if(s.done&&num(s.r)>=sp.max&&(num(s.rir)==null||num(s.rir)>=(parseFloat(sp.base)||0))&&!ups.includes(e.name))ups.push(e.name)}));
 S.sessions.push(sess);S.sessions.sort((x,y)=>x.date.localeCompare(y.date));
 const r=dayRec(a.date);r.unit=a.day;if(sess.ex.some(e=>/crunch|bauch|knee raise/i.test(e.name)))r.abs=true;
 S.active=null;relWake();stopTimer();save();weekCheck();render();
 const n=sess.ex.reduce((k,e)=>k+e.sets.length,0);
 openSheet(`<div class="sh-h"><h2>Einheit gespeichert</h2><button class="ib" data-a="close" aria-label="Schließen">✕</button></div><p>${n} Sätze in ${sess.dur} Minuten.</p>${ups.length?`<p><b>Nächstes Mal mehr Gewicht:</b><br>${ups.map(esc).join('<br>')}</p>`:'<p class="mut">Keine Übung am oberen Ende der Range. Nächstes Mal gleiches Gewicht und mehr Wiederholungen.</p>'}<button class="primary" data-a="close">Fertig</button>`)}

/* ---------- Plan-Editor ---------- */
function openEditor(di,ei){const e=ei==null?{name:'',muscle:'',setup:'',rest:90,inc:null,sets:[{min:8,max:12,rir:'1'},{min:8,max:12,rir:'1'}]}:S.plan.days[di].ex[ei];ui.edit={di,ei,e:JSON.parse(JSON.stringify(e))};openSheet(edHtml())}
async function edSave(){const e=ui.edit.e;e.name=String(e.name).trim();if(!e.name)return toast('Name fehlt');
 e.rest=parseInt(e.rest)||90;e.inc=num(e.inc);e.prog=e.prog==='reps'?'reps':'';e.gear=String(e.gear||'').trim();e.sets=e.sets.map(s=>{const mi=parseInt(s.min)||1;return {min:mi,max:Math.max(mi,parseInt(s.max)||mi),rir:String(s.rir||'0').trim()}});if(!e.sets.length)return toast('Mindestens ein Satz');
 const day=S.plan.days[ui.edit.di];
 if(ui.edit.ei==null){e.id=uid();day.ex.push(e)}else{const old=day.ex[ui.edit.ei];
  if(old.name!==e.name&&S.sessions.some(s=>s.ex.some(x=>x.name===old.name))&&await askC(`Bisherige Einträge von „${old.name}“ auch umbenennen? Dann laufen Verlauf und Vorschläge weiter.`))S.sessions.forEach(s=>s.ex.forEach(x=>{if(x.name===old.name)x.name=e.name}));
  day.ex[ui.edit.ei]=e}
 save();closeSheet();toast('Übung gespeichert')}

/* ---------- Messungen und Blut speichern ---------- */
function saveMB(key,fk,label){const f=ui[fk],vals={};Object.entries(f.vals).forEach(([k,v])=>{const n=num(v);if(n!=null)vals[k]=n});
 if(!f.date)return toast('Datum fehlt');if(!Object.keys(vals).length)return toast('Keine Werte eingetragen');
 const ex=S[key].find(x=>x.date===f.date);if(ex)Object.assign(ex.vals,vals);else S[key].push({date:f.date,vals});S[key].sort((a,b)=>a.date.localeCompare(b.date));
 ui[fk]={date:todayStr(),vals:{}};save();render();toast(`${label} gespeichert`)}

/* ---------- Backup und Import ---------- */
async function exportBackup(){const name=`eisen-backup-${todayStr()}.json`,data=JSON.stringify({app:'eisen',v:1,exported:new Date().toISOString(),data:S});
 const done=()=>{S.settings.lastBackup=todayStr();save();render();toast('Backup erstellt')};
 try{const file=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return done()}}catch(e){if(e&&e.name==='AbortError')return}
 if(DL){try{await DL.save({filename:name,data:data});return done()}catch(e){if(e&&e.code==='cancelled')return;toast('Backup abgebrochen');return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);done()}
function readImport(file){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result),src=o.data||o;if(!src.days&&!src.sessions)throw 0;ui.pendingImport=src;
 openSheet(`<div class="sh-h"><h2>Daten laden</h2><button class="ib" data-a="close" aria-label="Schließen">✕</button></div><p>In der Datei: ${Object.keys(src.days||{}).length} Tage, ${(src.sessions||[]).length} Einheiten, ${(src.measures||[]).length} Messungen, ${(src.blood||[]).length} Blutbilder, ${(src.phases||[]).length} Phasen.</p><p class="mut">Zusammenführen ergänzt nur, was hier noch fehlt. Ersetzen überschreibt alles auf diesem Gerät.</p><button class="primary" data-a="impmerge">Zusammenführen</button><button class="ghost danger" data-a="impreplace">Alles ersetzen</button>`)}catch(e){toast('Datei nicht lesbar. Bitte eine Eisen-Datei wählen.')}};fr.readAsText(file)}
function merge(src){
 Object.entries(src.days||{}).forEach(([d,r])=>{const t=S.days[d]||(S.days[d]={});Object.entries(r).forEach(([k,v])=>{if(t[k]==null||t[k]===''||(Array.isArray(t[k])&&!t[k].length))t[k]=v})});
 const ids=new Set(S.sessions.map(s=>s.id));(src.sessions||[]).forEach(s=>{if(!ids.has(s.id))S.sessions.push(s)});S.sessions.sort((a,b)=>a.date.localeCompare(b.date));
 ['measures','blood'].forEach(k=>{(src[k]||[]).forEach(x=>{const e=S[k].find(y=>y.date===x.date);if(e){Object.entries(x.vals).forEach(([n,v])=>{if(e.vals[n]==null)e.vals[n]=v})}else S[k].push(x)});S[k].sort((a,b)=>a.date.localeCompare(b.date))});
 const ph=new Set(S.phases.map(p=>p.start));(src.phases||[]).forEach(p=>{if(!ph.has(p.start))S.phases.push(p)});
 const tl=new Set(S.tolerance.map(t=>t.name.toLowerCase()));(src.tolerance||[]).forEach(t=>{if(!tl.has(t.name.toLowerCase()))S.tolerance.push(t)});
 const ss=src.settings||{};['supps','tags','pre','mfields'].forEach(k=>(ss[k]||[]).forEach(v=>{if(!S.settings[k].includes(v))S.settings[k].push(v)}));
 (ss.markers||[]).forEach(m=>{if(!S.settings.markers.some(x=>x.n===m.n))S.settings.markers.push(m)});
 if(src.cycle&&src.cycle.hist){const hn=new Set(S.cycle.hist.map(h=>h.n));src.cycle.hist.forEach(h=>{if(!hn.has(h.n))S.cycle.hist.push(h)});S.cycle.hist.sort((a,b)=>a.n-b.n)}
 if(src.plan&&src.plan.days)src.plan.days.forEach(d=>d.ex.forEach(e=>{const pe=planEx(e.name);if(pe&&!pe.setup&&e.setup)pe.setup=e.setup}))}

/* ---------- Aktionen ---------- */
async function act(a,ds,el){const A=S.active;switch(a){
 case 'tab':go(ds.t);break;
 case 'gear':go('mehr');break;
 case 'dprev':ui.date=addDays(ui.date,-1);render();break;
 case 'dnext':ui.date=addDays(ui.date,1);render();break;
 case 'dtoday':ui.date=todayStr();render();break;
 case 'supp':case 'tag':{const r=dayRec(ui.date),k=a==='supp'?'supps':'tags';r[k]=r[k]||[];const i=r[k].indexOf(ds.v);if(i<0)r[k].push(ds.v);else r[k].splice(i,1);save();el.classList.toggle('on');break}
 case 'suppall':dayRec(ui.date).supps=[...S.settings.supps];save();render();break;
 case 'addtag':{const v=$('#newtag').value.trim();if(!v)return;if(!S.settings.tags.includes(v))S.settings.tags.push(v);const r=dayRec(ui.date);r.tags=r.tags||[];if(!r.tags.includes(v))r.tags.push(v);save();render();break}
 case 'stool':{const r=dayRec(ui.date);r.stool=Math.max(0,(num(r.stool)||0)+(+ds.d));save();render();break}
 case 'abs':{const r=dayRec(ui.date);r.abs=!r.abs;save();el.classList.toggle('on');break}
 case 'gohealth':ui.health=ds.v;go('health');break;
 case 'start':startWorkout(ds.day);break;
 case 'pre':{const i=A.pre.indexOf(ds.v);if(i<0)A.pre.push(ds.v);else A.pre.splice(i,1);save();el.classList.toggle('on');break}
 case 'done':doneSet(+ds.ei,+ds.si);break;
 case 'exmenu':exMenu(+ds.ei);break;
 case 'ex-setup':{const e=A.ex[+ds.ei],v=await askP('Einstellung, z. B. Sitz 4, Füße 5',e.setup||'');if(v==null)return;e.setup=v.trim();const pe=planEx(e.name);if(pe)pe.setup=e.setup;save();closeSheet();break}
 case 'ex-swap':{const v=await askP('Welche Übung stattdessen?',A.ex[+ds.ei].name);if(!v||!v.trim())return;swapEx(+ds.ei,v.trim());save();closeSheet();break}
 case 'ex-addset':{const e=A.ex[+ds.ei];e.specs.push({...last(e.specs)});const ls=last(e.sets);e.sets.push({w:ls?ls.w:'',r:'',rir:'',done:false,up:false,low:false});save();closeSheet();break}
 case 'ex-delset':{const e=A.ex[+ds.ei];if(e.sets.length>1){e.sets.pop();if(e.specs.length>e.sets.length)e.specs.pop()}save();closeSheet();break}
 case 'ex-rest':{const e=A.ex[+ds.ei],v=parseInt(await askP('Pause in Sekunden',e.rest));if(!v)return;e.rest=v;const pe=planEx(e.name);if(pe)pe.rest=v;save();closeSheet();break}
 case 'ex-up':{const i=+ds.ei;if(i>0)[A.ex[i-1],A.ex[i]]=[A.ex[i],A.ex[i-1]];save();closeSheet();break}
 case 'ex-del':if(await askC('Übung für heute entfernen?')){A.ex.splice(+ds.ei,1);save()}closeSheet();break;
 case 'addex':{const v=await askP('Name der Übung');if(!v||!v.trim())return;const n=v.trim();A.ex.push(mkEx(planEx(n)||{name:n,muscle:'',setup:'',rest:90,inc:null,sets:[{min:8,max:12,rir:'1'},{min:8,max:12,rir:'1'}]},A.day,A.mode));save();render();break}
 case 'finish':finish();break;
 case 'discard':if(await askC('Einheit verwerfen? Alle Sätze von heute gehen verloren.')){S.active=null;relWake();stopTimer();save();render()}break;
 case 'tplus':if(T.done)startRest(15);else{T.end+=15e3;T.dur+=15;tick()}break;
 case 'tminus':T.end-=15e3;tick();break;
 case 'tskip':stopTimer();break;
 case 'sess':sessSheet(ds.id);break;
 case 'sessdel':if(await askC('Diese Einheit endgültig löschen?')){S.sessions=S.sessions.filter(s=>s.id!==ds.id);save();closeSheet()}break;
 case 'close':closeSheet();break;
 case 'cycnum':{const v=parseInt(await askP('Nummer des aktuellen Zyklus',S.cycle.n));if(v>0){S.cycle.n=v;save();render()}break}
 case 'wk':{const c=S.cycle;c.week=Math.min(c.len,Math.max(1,c.week+(+ds.d)));save();render();break}
 case 'newcyc':if(await askC(`Zyklus ${S.cycle.n} abschließen und Zyklus ${S.cycle.n+1} starten?`)){newCycle();render();toast(`Zyklus ${S.cycle.n} gestartet`)}break;
 case 'ctog':S.cycle[ds.k]=!S.cycle[ds.k];save();render();break;
 case 'pday':ui.openDay=ui.openDay===+ds.di?null:+ds.di;render();break;
 case 'editex':openEditor(+ds.di,+ds.ei);break;
 case 'newex':openEditor(+ds.di,null);break;
 case 'mvex':{const d=S.plan.days[+ds.di],i=+ds.ei,j=i+(+ds.d);if(j>=0&&j<d.ex.length){[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];save();render()}break}
 case 'renday':{const d=S.plan.days[+ds.di],v=await askP('Neuer Name',d.name);if(!v||!v.trim())return;const o=d.name,n=v.trim();d.name=n;S.plan.rotation=S.plan.rotation.map(x=>x===o?n:x);S.sessions.forEach(s=>{if(s.day===o)s.day=n});save();render();break}
 case 'delday':{const d=S.plan.days[+ds.di];if(await askC(`Trainingstag ${d.name} löschen? Gespeicherte Einheiten bleiben erhalten.`)){S.plan.days.splice(+ds.di,1);S.plan.rotation=S.plan.rotation.filter(x=>x!==d.name);ui.openDay=null;save();render()}break}
 case 'newday':{const v=await askP('Name des Trainingstags');if(!v||!v.trim())return;S.plan.days.push({name:v.trim(),ex:[]});S.plan.rotation.push(v.trim());ui.openDay=S.plan.days.length-1;save();render();break}
 case 'edaddset':{const e=ui.edit.e;e.sets.push({...(last(e.sets)||{min:8,max:12,rir:'1'})});$('#sheetc').innerHTML=edHtml();break}
 case 'eddelset':ui.edit.e.sets.splice(+ds.i,1);$('#sheetc').innerHTML=edHtml();break;
 case 'edsave':edSave();break;
 case 'eddel':if(await askC('Übung aus dem Plan löschen?')){S.plan.days[ui.edit.di].ex.splice(ui.edit.ei,1);save();closeSheet()}break;
 case 'seg':ui[ds.k]=ds.v;render();break;
 case 'range':ui.range=ds.v;render();break;
 case 'phadd':{const f=ui.phform;if(!f.date)return toast('Datum fehlt');S.phases.push({type:f.type,start:f.date});save();render();toast('Phase gespeichert');break}
 case 'phdel':if(await askC('Phase löschen?')){S.phases.splice(+ds.i,1);save();render()}break;
 case 'mbsave':saveMB(ds.k,ds.f,ds.k==='blood'?'Blutbild':'Messung');break;
 case 'mdel':if(await askC('Messung löschen?')){S.measures.splice(+ds.i,1);save();render()}break;
 case 'bdel':if(await askC('Blutbild löschen?')){S.blood.splice(+ds.i,1);save();render()}break;
 case 'tolpick':ui.tform.rate=ds.v;render();break;
 case 'toladd':{const f=ui.tform;if(!f.name.trim())return toast('Name fehlt');S.tolerance.push({name:f.name.trim(),rate:f.rate,note:f.note.trim(),date:todayStr()});ui.tform={name:'',rate:'gut',note:''};save();render();break}
 case 'tolrate':{const t=S.tolerance[+ds.i];t.rate=RORD[(RORD.indexOf(t.rate)+1)%3];save();render();break}
 case 'toldel':if(await askC('Eintrag löschen?')){S.tolerance.splice(+ds.i,1);save();render()}break;
 case 'backup':exportBackup();break;
 case 'imp':$('#imp').click();break;
 case 'impmerge':merge(ui.pendingImport);ui.pendingImport=null;save();closeSheet();toast('Daten zusammengeführt');break;
 case 'impreplace':if(await askC('Alle Daten auf diesem Gerät durch die Datei ersetzen?')){S=migrate(ui.pendingImport);ui.pendingImport=null;save();closeSheet();toast('Daten geladen')}break;
 case 'persist':if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(()=>persistStatus());break;
 case 'reset':if(await askC('Wirklich alle Daten löschen?')&&await askC('Sicher? Ohne Backup ist alles weg.')){S=fresh();save();go('heute')}break;
}}

let HIST=null,AS=null,ADB=null,DL=null,PURL={},cloudT=null,CLOUD='aus',CLOUDMSG='',CLOUDTRY=0,SEEDED=false;

async function loadHist(){
 try{const r=await fetch('data/history.json',{cache:'force-cache'});if(r.ok){HIST=await r.json();return}}catch(e){}
 try{HIST=JSON.parse(localStorage.getItem('eisen.hist')||'null')}catch(e){}
}
