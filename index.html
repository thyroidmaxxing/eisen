}
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise(r=>setTimeout(()=>r(null),ms))]);

/* Erststart ohne Wolke, also auf GitHub Pages: der mitgelieferte Stand wird einmal
   übernommen. Nur wenn lokal wirklich nichts liegt, vorhandene Daten bleiben unberührt. */
async function seedLocal(st){
 if(typeof claude!=='undefined'&&claude.use)return false;
 if(st&&(Object.keys(st.days||{}).length||(st.sessions||[]).length))return false;
 try{
  const r=await fetch('data/seed.json',{cache:'force-cache'});
  if(!r.ok)return false;
  const d=await r.json();
  if(!d||!d.s)return false;
  S=migrate(d.s);
  S._ts=d.ts||Date.now();
  await DB.set('state',S);
  SEEDED=true;
  return true;
 }catch(e){return false}
}
async function cloudInit(){
 if(typeof claude==='undefined'||!claude.use){CLOUD='lokal';return}
 /* der Speicher meldet sich manchmal erst Sekunden nach dem Laden, darum mehrere Anläufe */
 for(const wait of [0,1500,4000,8000]){
  if(wait)await new Promise(r=>setTimeout(r,wait));
  CLOUDTRY++;
  try{ADB=await withTimeout(claude.use('db'),12000)}catch(e){ADB=null;CLOUDMSG=(e&&(e.code||e.message))||'Fehler'}
  if(ADB)break;
  if(!CLOUDMSG)CLOUDMSG='keine Antwort';
 }
 CLOUD=ADB?'an':'blockiert';
 /* Fotospeicher und Download werden erst später gebraucht, die bremsen den Start nicht */
 withTimeout(claude.use('assets'),15000).then(x=>{AS=x}).catch(()=>{});
 withTimeout(claude.use('downloads'),15000).then(x=>{DL=x}).catch(()=>{});
}
/* Schnappschuesse des Speichers sind eingefroren, darum immer eine eigene Kopie */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const docGet=async p=>{try{const s=await ADB.doc(p).get();return s.exists?clone(s.data()):null}catch(e){return null}};
const docSet=async(p,b)=>{try{await ADB.doc(p).set(b);return true}catch(e){return false}};
function byYear(list){const o={};(list||[]).forEach(x=>{const y=(x.date||'').slice(0,4);if(y)(o[y]=o[y]||[]).push(x)});return o}
async function cloudPull(){
 if(!ADB)return null;
 const main=await docGet('state/main');
 if(!main||!main.s)return null;
 const st=clone(main.s);st.sessions=[];
 for(const y of (main.years||[])){const d=await docGet('sess/'+y);if(d&&d.s)st.sessions.push(...d.s)}
 st.sessions.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
 return {st:st,ts:main.ts||0};
}
async function cloudPush(){
 if(!ADB||!S)return;
 const by=byYear(S.sessions),years=Object.keys(by).sort(),copy=Object.assign({},S);
 delete copy.sessions;
 const ts=S._ts||Date.now();
 if(!await docSet('state/main',{s:copy,years:years,ts:ts}))return;
 for(const y of years)await docSet('sess/'+y,{s:by[y],ts:ts});
}
function cloudSave(){if(!ADB)return;clearTimeout(cloudT);cloudT=setTimeout(cloudPush,1500)}

async function phHydrate(){
 let any=false;
 for(const p of (S.photos||[])){
  if(p.asset||PURL[p.id]||!p.blobKey)continue;

  if(b){PURL[p.id]=URL.createObjectURL(b);any=true}

function shrink(file){
 return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const sc=Math.min(1,1600/Math.max(im.width,im.height));
   const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};
  im.src=u;
 });
}
async function phAdd(files,date,pose){

 for(const f of files){
  if(!/^image\//.test(f.type))continue;

   const blob=await shrink(f),id=uid(),rec={id:id,date:date,pose:pose};
   const d=S.days[date]||{},w=num(d.w);

   const mm=nearM?nearM(date):null;
   if(mm&&mm.vals&&mm.vals['KFA %']!=null)rec.kfa=num(mm.vals['KFA %']);
   if(AS){const r=await AS.upload(blob);rec.asset=r.id}
   else{const k='photo-'+id;await DB.set(k,blob);rec.blobKey=k;PURL[id]=URL.createObjectURL(blob)}
   S.photos.push(rec);ok++;
  }catch(e){err=(e&&e.code)||(e&&e.message)||'Fehler';break}
 }
 if(ok){S.photos.sort((a,b)=>a.date<b.date?-1:1);save();cloudSave()}
 toast(ok?(ok===1?'Foto gespeichert':ok+' Fotos gespeichert'):('Kein Foto gespeichert'+(err?', '+err:'')));

}

/* ---------- Kalorienvorgabe ----------
   Der Verbrauch kommt aus deinen eigenen Zahlen: mittlere Zufuhr im Zeitraum
   gegen die Veränderung des 7-Tage-Gewichts, 7700 kcal je Kilogramm. */
const GOALS=[['-0.50','scharfe Diät'],['-0.35','Diät'],['-0.20','sanfte Diät'],
 ['0','Erhalt'],['0.15','langsamer Aufbau'],['0.30','Aufbau']];
function tdeeWin(win){
 const to=todayStr(),from=addDays(to,-(win-1));
 const wr=rolling(series('w'),7).filter(p=>p[0]>=from);
 const kc=series('kcal').filter(p=>p[0]>=from);
 if(wr.length<6||kc.length<5)return null;
 const n=daysBetween(wr[0][0],wr[wr.length-1][0]);
 if(n<7)return null;
 const dw=wr[wr.length-1][1]-wr[0][1],mean=avg(kc.map(x=>x[1]));
 return {win:win,n:n,logged:kc.length,mean:mean,rate:dw/n*7,
         tdee:mean-dw*7700/n,w:wr[wr.length-1][1]};
}
function targetFrom(rate,tdee,w){

/* Tonnage je Woche: Last mal Wiederholungen über alle Sätze */
function tonnageWeeks(n){
 const by={};
 S.sessions.forEach(s=>{
  const k=monday(s.date);
  let t=0;
  (s.ex||[]).forEach(e=>(e.sets||[]).forEach(x=>{
   const w=num(x.w),r=num(x.r);if(w!=null&&r!=null)t+=w*r;
  }));
  by[k]=(by[k]||0)+t;
 });
 return Object.keys(by).sort().slice(-n).map(k=>[k,by[k]]);
}
function bestE1Weeks(n){
 const by={};
 S.sessions.forEach(s=>(s.ex||[]).forEach(e=>{
  const t=(e.sets||[])[0];if(!t)return;
  const v=e1rm(t.w,t.r);if(!v)return;
  const k=s.day+'|'+e.name;
  (by[k]=by[k]||[]).push([monday(s.date),v]);
 }));
 let bk=null;
 for(const k in by)if(!bk||by[k].length>by[bk].length)bk=k;
 if(!bk)return {name:null,pts:[]};
 const wk={};
 by[bk].forEach(([w,v])=>{wk[w]=Math.max(wk[w]||0,v)});

function sparkSVG(pts,col){

const MGRP=[['Brust',/brust/i],['Rücken',/lat|trapez|rücken|row/i],['Schulter',/schulter|delt/i],

function mgOf(m){for(const g of MGRP)if(g[1].test(m||''))return g[0];return 'Sonstige'}
function planVolume(){
 const v={};
 S.plan.days.forEach(d=>d.ex.forEach(e=>{
  const g=mgOf(e.muscle);v[g]=(v[g]||0)+e.sets.length;

function weekKeys(n){

  const s=S.sessions[i],k=s.cycle+'|'+s.week;

function loggedVolume(key){

/* ---------- Ausführung erzwingen ----------
   Der Zielbereich ist keine Empfehlung mehr, sondern wird beim Eintragen geprüft.
   Landest du darunter, rechnet die App die passende Last aus und bietet sie an. */
function specOf(ei,si){const e=S.active&&S.active.ex[ei];if(!e)return null;return e.specs[si]||last(e.specs)}
function corrLoad(w,r,sp,inc){
 inc=inc||2.5;
 const mid=(sp.min+sp.max)/2,e1=w*(1+r/30);
 let t=Math.round(e1/(1+mid/30)/inc)*inc;
 if(t>=w)t=w-inc;
 const floor=Math.round(w*0.8/inc)*inc;   /* höchstens ein Fünftel auf einmal runter */
 if(t<floor)t=floor;
 return t>0?rnd(t):null;
}
function hitStats(a){
 let hit=0,miss=0,over=0;
 (a.ex||[]).forEach(e=>e.sets.forEach((s,i)=>{
  if(!s.done)return;
  const sp=e.specs[i]||last(e.specs),r=num(s.r);
  if(!sp||r==null)return;
  if(r<sp.min)miss++;else if(r>sp.max)over++;else hit++;
 }));
 return {hit:hit,miss:miss,over:over,tot:hit+miss+over};
}
function hitLine(a){
 const h=hitStats(a);
 if(!h.tot)return '';
 return `<p class="hitline ${h.miss>h.hit?'bad':''}">Im Ziel <b>${h.hit}</b> von ${h.tot}`+
  (h.miss?`, ${h.miss} zu schwer`:'')+(h.over?`, ${h.over} zu leicht`:'')+`</p>`;
}
function markSet(ei,si){
 if(!S.active)return;
 const inp=document.querySelector(`[data-set="${ei},${si},r"]`);
 if(!inp)return;
 const row=inp.closest('.set'),sp=specOf(ei,si);
 if(!row||!sp)return;
 const lab=inp.parentElement;
 lab.classList.remove('hit','miss','over');
 const nx=row.nextElementSibling;
 if(nx&&nx.classList.contains('fixline'))nx.remove();
 const r=num(inp.value);
 if(inp.value===''||r==null)return;
 if(r>sp.max){lab.classList.add('over');return}
 if(r>=sp.min){lab.classList.add('hit');return}
 lab.classList.add('miss');
 const e=S.active.ex[ei],w=num(e.sets[si].w),inc=num(e.inc)||num(S.settings.inc)||2.5;
 let btn='';
 if(w!=null){
  const t=corrLoad(w,r,sp,inc);
  if(t&&t<w)btn=`<button data-pa="fixload" data-v="${ei},${si},${t}">${dv(t)} kg übernehmen</button>`;
 }
 row.insertAdjacentHTML('afterend',
  `<div class="fixline"><span>${r} statt ${sp.min} bis ${sp.max}, die Last ist zu hoch</span>${btn}</div>`);
}
function markAllSets(){
 if(!S||!S.active)return;
 S.active.ex.forEach((e,ei)=>e.sets.forEach((s,si)=>markSet(ei,si)));
}
document.addEventListener('input',e=>{
 const ds=e.target.dataset;
 if(ds&&ds.set&&/,r$/.test(ds.set)&&S&&S.active){
  const parts=ds.set.split(',');
  markSet(+parts[0],+parts[1]);
 }
});

/* ---------- Woche und Zyklus als Band statt als Dialog ---------- */
function weekComplete(){
 const c=S.cycle;
 const need=[...new Set(S.plan.rotation.filter(x=>x!=='Off'&&S.plan.days.some(d=>d.name===x)))];
 if(!need.length)return null;
 const done=new Set(S.sessions.filter(s=>s.cycle===c.n&&s.week===c.week).map(s=>s.day));
 if(!need.every(d=>done.has(d)))return null;
 return c.week<c.len?'week':'cycle';
}
function weekBanner(){
 const c=S.cycle,w=weekComplete();
 if(w==='week')return `<div class="banner"><div><b>Woche ${c.week} ist komplett</b>
  <span>Alle Trainingstage dieser Woche sind durch.</span></div>
  <button data-pa="nextweek">Woche ${c.week+1}</button></div>`;
 if(w==='cycle')return `<div class="banner"><div><b>Zyklus ${c.n} ist komplett</b>
  <span>Alle ${c.len} Wochen sind durch.</span></div>
  <button data-pa="newcyc">Neuer Zyklus</button></div>`;
 return '';
}

/* ---------- Planupdate ----------
   Neue Übungen kommen über eine mitgelieferte Datei dazu, nicht über einen Import.
   Ergänzt wird nur, was im Plan fehlt, bestehende Übungen und der Verlauf bleiben. */
let PU=null;
const puDay=n=>((S.plan&&S.plan.days)||[]).find(x=>x.name===n);
function puMissing(d){
 let add=0,del=0;
 (d&&d.add||[]).forEach(b=>{const day=puDay(b.day);if(!day)return;
  (b.ex||[]).forEach(x=>{if(!(day.ex||[]).some(y=>y.name===x.name))add++})});
 (d&&d.del||[]).forEach(b=>{const day=puDay(b.day);if(!day)return;
  (b.ex||[]).forEach(nm=>{if((day.ex||[]).some(y=>y.name===nm))del++})});
 return {add,del,n:add+del};
}
function puTxt(d){const m=puMissing(d),p=[];
 if(m.add)p.push(m.add+(m.add>1?' Übungen kommen dazu':' Übung kommt dazu'));
 if(m.del)p.push(m.del+(m.del>1?' fallen weg':' fällt weg'));
 return p.join(', ')+'. Dein Verlauf bleibt vollständig erhalten.';
}
async function planLoad(){
 try{
  const r=await fetch('data/plan-update.json',{cache:'no-cache'});
  if(!r.ok)return;
  const d=await r.json();
  if(!d||!d.v||(num(S.planV)||0)>=d.v)return;
  if(!puMissing(d).n)return;
  PU=d;render();
 }catch(e){}
}
function puBanner(){
 if(!PU)return '';
 return `<div class="banner"><div><b>Planupdate: ${esc(PU.name||'')}</b>
  <span>${esc(PU.note||'')} ${esc(puTxt(PU))}</span></div>
  <button data-pa="puok">Übernehmen</button>
  <button class="ib sm" data-pa="puno" aria-label="Später">✕</button></div>`;
}
function puApply(){
 if(!PU)return;
 let a=0,r=0;
 (PU.del||[]).forEach(b=>{const day=puDay(b.day);if(!day)return;
  (b.ex||[]).forEach(nm=>{const i=(day.ex||[]).findIndex(y=>y.name===nm);
   if(i>=0){day.ex.splice(i,1);r++}})});
 (PU.add||[]).forEach(b=>{const day=puDay(b.day);if(!day)return;
  (b.ex||[]).forEach(x=>{
   if((day.ex||[]).some(y=>y.name===x.name))return;
   const e=JSON.parse(JSON.stringify(x));e.id=uid();
   day.ex.push(e);a++})});
 S.planV=PU.v;PU=null;
 save();render();
 toast(a?(a+' ergänzt'+(r?', '+r+' entfernt':'')):(r+' entfernt'));
}

/* ---------- Bereitschaft ----------
   Vergleicht Puls, Temperatur und Schlaf mit der eigenen Basis der letzten 30 Tage
   und den Gewichtstrend mit dem, was pro Woche sinnvoll ist. Keine Diagnose,
   nur deine Zahlen gegen deine Zahlen. */
function medOf(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;
 return s.length%2?s[m]:(s[m-1]+s[m])/2}
function baseOf(f,d,win){const a=[];
 for(let i=1;i<=win;i++){const r=S.days[addDays(d,-i)],v=r?num(r[f]):null;if(v!=null)a.push(v)}
 return {n:a.length,med:medOf(a)}}
function wRate(d){const a=rng(d,0,6,'w'),b=rng(d,7,13,'w');
 if(a.length<4||b.length<4)return null;
 const x=avg(a),y=avg(b);
 return {kg:x-y,pct:(x-y)/y*100}}
const RDOT={gut:C.grn,achtung:C.yel,stop:C.red};
const RTXT={gut:'Alles im Rahmen',achtung:'Achtung',stop:'Heute zurückstecken'};
function readiness(d){
 const r=S.days[d]||{},it=[];
 const hr=num(r.hr1),bh=baseOf('hr1',d,30);
 if(hr!=null&&bh.n>=7){const x=hr-bh.med;
  it.push({l:'Ruhepuls morgens',v:fmt(hr,0)+' bpm',b:'Basis '+fmt(bh.med,0),
   s:x>=8?'stop':x>=4?'achtung':'gut',
   t:x>=8?'Deutlich über deiner Basis. Das ist der klarste Hinweis auf Erholungsrückstand oder einen beginnenden Infekt.'
    :x>=4?'Leicht erhöht. Ein Tag ist nichts, zwei in Folge heißen weniger Umfang.'
    :'Im Rahmen.'})}
 const t=num(r.t1),bt=baseOf('t1',d,30);
 if(t!=null&&bt.n>=7){const x=t-bt.med;
  it.push({l:'Temperatur morgens',v:fmt(t,2)+' °C',b:'Basis '+fmt(bt.med,2),
   s:x>=.4?'stop':x<=-.3?'achtung':'gut',
   t:x>=.4?'Deutlich über deiner Basis. Heute nicht trainieren.'
    :x<=-.3?'Unter deiner Basis. Über mehrere Tage ist das bei dir meist ein Zeichen für zu lange zu wenig Energie.'
    :'Im Rahmen.'})}
 const sl=num(r.sleep);
 if(sl!=null)it.push({l:'Schlaf',v:fmt(sl,1)+' h',b:'',
  s:sl<5?'stop':sl<6.5?'achtung':'gut',
  t:sl<5?'Zu wenig. Top-Sätze heute streichen, Rückensätze normal.'
   :sl<6.5?'Knapp. Last halten statt steigern.':'Reicht.'});
 const w=wRate(d);
 if(w){const p=w.pct;
  it.push({l:'Gewichtstrend',v:sg(w.kg,2)+' kg pro Woche',b:sg(p,2)+' % pro Woche',
   s:(p>.75||p<-1)?'stop':(p>.5||p<-.5)?'achtung':'gut',
   t:p>.75?'Zunahme zu schnell. Ab etwa einem halben Prozent pro Woche ist der Zuwachs überwiegend Fett. Kalorien runter.'
    :p>.5?'Am oberen Rand. Mehr als ein halbes Prozent pro Woche bringt dir kaum mehr Muskel, nur mehr Fett.'
    :p<-1?'Abnahme zu schnell. Bei dieser Rate geht Muskel mit.'
    :p<-.5?'Zügige Abnahme. Für ein paar Wochen vertretbar, nicht dauerhaft.'
    :'Im Rahmen.'})}
 if(it.length<2)return null;
 return {s:it.some(x=>x.s==='stop')?'stop':it.some(x=>x.s==='achtung')?'achtung':'gut',items:it};
}
function readyCard(d){
 const R=readiness(d);
 if(!R)return '';
 const open=ui.rdet==null?R.s!=='gut':ui.rdet,bad=R.items.filter(x=>x.s!=='gut');
 return `<div class="ready ${R.s}"><div class="rh">${dot(RDOT[R.s],'lg')}<b>${RTXT[R.s]}</b>
  <button class="ib sm" data-pa="rdet" aria-label="Details">${open?'▴':'▾'}</button></div>
  ${!open&&bad.length?`<p class="rsum">${bad.map(x=>esc(x.l)).join(', ')}</p>`:''}
  ${open?`<div class="rlist">${R.items.map(x=>`<div class="ri ${x.s}">${dot(RDOT[x.s])}
   <span class="grow"><b>${esc(x.l)}</b><small>${esc(x.v)}${x.b?' · '+esc(x.b):''}</small>
   <em>${esc(x.t)}</em></span></div>`).join('')}</div>`:''}</div>`;
}

function markerSync(){
 if((num(S.settings.mkV)||0)>=MKV)return 0;
 const old=S.settings.markers||[],by={};
 old.forEach(m=>{by[m.n]=m});
 const gl=(a,b)=>(a==null&&b==null)||(a!=null&&b!=null&&Math.abs(a-b)<1e-9);
 const eigenerBereich=(o,n)=>{const L=REFLAB[n];
  if(!L)return o.lo!==undefined||o.hi!==undefined;
  return !(gl(o.lo==null?null:o.lo,L[0])&&gl(o.hi==null?null:o.hi,L[1]))};
 const out=MKLIST.map(([n,u])=>{const o=by[n]||{};
  const m={n:n,u:o.u||u};
  if(eigenerBereich(o,n)){
   if(o.lo!==undefined)m.lo=o.lo;
   if(o.hi!==undefined)m.hi=o.hi;
  }
  return m});
 const eigen=old.filter(m=>!MKLIST.some(x=>x[0]===m.n)&&!MKDROP.includes(m.n));
 S.settings.markers=out.concat(eigen);
 S.settings.mkV=MKV;
 return 1;
}
/* Marker, die nach harten Einheiten regelmäßig erhöht sind */
const REFTRAIN=['CK','hs-CRP','Kreatinin','eGFR (Kreatinin)','GOT (AST)','GPT (ALT)','CK-MB'];
function refFill(){
 let n=0;
 (S.settings.markers||[]).forEach(m=>{
  if(m.lo!==undefined||m.hi!==undefined)return;
  const r=REF[m.n];if(!r)return;
  m.lo=r[0];m.hi=r[1];n++;
 });
 return n;
}
function refTxt(m){
 if(m.lo==null&&m.hi==null)return '';
 if(m.lo==null)return 'bis '+dv(m.hi);
 if(m.hi==null)return 'ab '+dv(m.lo);
 return dv(m.lo)+' bis '+dv(m.hi);
}
function refState(name,v){
 const m=(S.settings.markers||[]).find(x=>x.n===name);
 if(!m||v==null)return '';
 const L=REFLAB[name];
 if(L){
  if(L[0]!=null&&v<L[0])return 'hart-lo';
  if(L[1]!=null&&v>L[1])return 'hart-hi';
 }
 if(m.lo!=null&&v<m.lo)return 'ziel-lo';
 if(m.hi!=null&&v>m.hi)return 'ziel-hi';
 if(m.lo==null&&m.hi==null)return '';
 return 'in';
}

 'ziel-lo':'\u25bc','ziel-hi':'\u25b2',in:''};

/* ---------- Zyklusvergleich ---------- */
function cycList(){
 const by={};
 S.sessions.forEach(s=>{if(s.cycle==null)return;(by[s.cycle]=by[s.cycle]||[]).push(s)});
 const spec=planSpecMap();
 return Object.keys(by).map(Number).sort((a,b)=>a-b).map(n=>{
  const ss=by[n].slice().sort((a,b)=>a.date<b.date?-1:1);
  let sets=0,ton=0,rs=0,rn=0,hit=0,rated=0;
  ss.forEach(s=>(s.ex||[]).forEach(e=>{
   const pe=spec[s.day+'|'+e.name],sp=pe&&pe.sets;
   (e.sets||[]).forEach((t,i)=>{
    const w=num(t.w),r=num(t.r),ri=num(t.rir);
    sets++;
    if(w!=null&&r!=null)ton+=w*r;
    if(ri!=null){rs+=ri;rn++}
    if(sp&&r!=null){const k=sp[i]||last(sp);
     if(k&&k.min!=null){rated++;if(r>=k.min&&r<=k.max)hit++}}
   })}));
  const von=ss[0].date,bis=last(ss).date;
  const wa=avg(rng(von,0,6,'w')),wb=avg(rng(bis,0,6,'w'));
  return {n,von,bis,eh:ss.length,sets,ton,
   rir:rn?rs/rn:null,quote:rated?Math.round(100*hit/rated):null,
   wa,wb,dw:(wa!=null&&wb!=null)?wb-wa:null,
   tage:daysBetween(von,bis)+1,ss};
 });
}
function cycBest(ss){
 const o={};
 ss.forEach(s=>{if(s.mode==='deload')return;
  (s.ex||[]).forEach(e=>{const k=e.name+(e.gear?' ('+e.gear+')':'');
   (e.sets||[]).forEach(t=>{const r=num(t.r);
    if(r==null||r<1||r>12)return;
    const v=e1rm(t.w,t.r);
    if(v&&(o[k]==null||v>o[k]))o[k]=v})})});
 return o;
}
function pZyklus(){
 const L=cycList();
 if(L.length<1)return '<p class="empty">Noch keine Einheiten mit Zyklusnummer.</p>';
 const R=[...L].reverse();
 let h=`<div class="card"><table class="t"><thead><tr><th>Zyklus</th><th>Einheiten</th>
  <th>im Ziel</th><th>Tonnage</th><th>Gewicht</th></tr></thead><tbody>
  ${R.map(c=>`<tr><td>${c.n}<small>${fDs(c.von)} bis ${fDs(c.bis)}</small></td>
   <td>${c.eh}<small>${c.sets} Sätze</small></td>
   <td class="${c.quote!=null&&c.quote<50?'hi':''}">${c.quote!=null?c.quote+' %':'\u2013'}
    <small>RIR ${c.rir!=null?fmt(c.rir,1):'\u2013'}</small></td>
   <td>${fmt(c.ton/1000,1)}<small>t</small></td>
   <td>${c.dw!=null?sg(c.dw,1):'–'}<small>${c.wb!=null?fmt(c.wb,1)+' kg':''}</small></td></tr>`).join('')}
  </tbody></table></div>`;
 h+=`<p class="hint">Die Trefferquote misst gegen den Plan, wie er heute aussieht.
  Hast du seitdem Bereiche geändert, verschiebt das ältere Zyklen leicht.</p>`;
 if(L.length>=2){
  const b=L[L.length-1],a=L[L.length-2];
  const ba=cycBest(a.ss),bb=cycBest(b.ss);
  const keys=Object.keys(bb).filter(k=>ba[k]!=null)
   .sort((x,y)=>(bb[y]-ba[y])/ba[y]-(bb[x]-ba[x])/ba[x]);
  h+=`<section class="sec"><h3>Zyklus ${a.n} gegen ${b.n}</h3>`;
  h+=keys.length?`<div class="card"><table class="t"><thead><tr><th>Übung</th>
   <th>${a.n}</th><th>${b.n}</th><th>Δ</th></tr></thead><tbody>
   ${keys.map(k=>{const d=(bb[k]-ba[k])/ba[k]*100;
    return `<tr><td>${esc(k)}<small>bestes 1RM in kg</small></td>
    <td>${fmt(ba[k],1)}</td><td>${fmt(bb[k],1)}</td>
    <td class="${d<-2?'hi':''}">${sg(d,1)}<small>%</small></td></tr>`}).join('')}
   </tbody></table></div>
   <p class="hint">Geschätztes 1RM aus dem besten Satz mit 1 bis 12 Wiederholungen,
   darüber wird die Schätzung unbrauchbar. Deloadwochen bleiben draußen.
   Übungen mit eigener Geräteversion stehen getrennt, weil die Lasten nicht vergleichbar sind.</p>`
   :'<p class="empty">Keine Übung kommt in beiden Zyklen vor.</p>';
  h+=`</section>`;
 }
 return h;
}
